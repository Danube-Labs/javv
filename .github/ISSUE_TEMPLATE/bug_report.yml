name: Bug report
description: Something in JAVV behaves wrongly or fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security vulnerabilities go through the private form** in
        [SECURITY.md](https://github.com/Danube-Labs/javv/blob/main/SECURITY.md), not here.
        Please remove tokens, passwords and internal hostnames from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Findings with cluster ...
        2. Filter by ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - Backend API
        - Ingest (scanner push)
        - Scanner images (Trivy / Grype)
        - Background jobs
        - Deployment / setup
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: JAVV version
      description: The release tag or commit, e.g. v0.4.5 or 6c0b77a.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How JAVV runs (dev stack, k3d, Kubernetes), OpenSearch version, browser if it's a UI issue.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Backend log lines (JSON), browser console errors, or screenshots. Pasted text is shown as code.
      render: shell
