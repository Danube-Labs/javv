name: Feature request
description: Suggest something JAVV should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The behaviour you want. Screens, API calls or example output help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: Anything you use today instead, or other ways this could work.
  - type: markdown
    attributes:
      value: |
        Some directions are settled by design and won't change, for example: Trivy and Grype results
        are never merged into one, every read is scoped to one cluster, and there's no external
        message broker. See the hard constraints in
        [CONTRIBUTING.md](https://github.com/Danube-Labs/javv/blob/main/CONTRIBUTING.md).
