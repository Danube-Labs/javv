name: Sign and attest images
description: >-
  Keyless cosign signature plus a signed SPDX SBOM attestation for each pushed image, by digest.
  The calling job needs `id-token: write` (the Fulcio certificate comes from the job's OIDC token)
  and `packages: write` (the signature and attestation are pushed next to the image).
inputs:
  images:
    description: 'One image per line: "<registry>/<name>@sha256:<digest> <path-to-spdx-json-sbom>"'
    required: true
  cosign-version:
    description: cosign release to install, without the "v" (versions.yaml supply_chain.cosign)
    required: true
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        cosign-release: v${{ inputs.cosign-version }}
    - name: Sign + attest each image by digest
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
      run: |
        set -euo pipefail
        signed=0
        while read -r ref sbom; do
          [ -n "$ref" ] || continue
          # a tag can be moved after signing; only a digest binds the signature to what was pushed
          case "$ref" in
            *@sha256:*) ;;
            *) echo "::error::$ref is not pinned by digest"; exit 1 ;;
          esac
          [ -s "$sbom" ] || { echo "::error::no SBOM at '$sbom' for $ref"; exit 1; }
          echo "::group::sign + attest $ref"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "$sbom" "$ref"
          echo "::endgroup::"
          signed=$((signed + 1))
        done <<< "$IMAGES"
        [ "$signed" -gt 0 ] || { echo "::error::no images to sign"; exit 1; }
        echo "signed and attested $signed image(s)"
