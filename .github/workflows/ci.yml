name: CI

# Quality gate for every PR + push to main, as required by
# development/standards/definition-of-done.md, git-workflow.md and testing.md. Active gates:
#   - commitlint (PR commits; release-please depends on the types)
#   - secret-scan: gitleaks over the full history
#   - javv-common / scanner: ruff + pyright + pytest
#   - backend-static: ruff + pyright + the docs-drift check; backend: pytest against a real
#     OpenSearch service container (coverage floor --cov-fail-under, #383)
#   - app-images (issue 452): the app's Docker images build without a push, then start and answer
#   - compose (issues 452, 715, 729): the stack from deploy/compose, signed in through the frontend,
#     OpenSearch's login and users checked, and the javv role walked over every surface
#   - helm (issues 725, 780), two jobs side by side: helm-opensearch runs ct lint, the chart
#     READMEs, the release's package/push/pull and ct install of javv-opensearch in kind;
#     helm-app runs ct install of javv and javv-scanner, the app's sign-in, upgrade and rollback,
#     and a scanner cycle pushing from a second cluster
#   - dependency-audit (issue 552): pip-audit + npm audit, report-only
#   - docs-site (issue 639): the operator docs site's strict build (docs-site/mkdocs.yml, Zensical)
#   - frontend: oxlint/eslint/stylelint + vue-tsc + vitest (coverage floor in
#     vitest.config.ts, #383) + the I4/I7 contract gates (openapi.json snapshot must match
#     the backend code, generated client must match the snapshot — this is what catches a
#     backend route/model change shipped without regenerating the client)
#   - frontend-smoke (#383, testing.md §4): the BUILT app + a fixture-seeded live backend,
#     walked headless through every route (frontend/scripts/ci-smoke.mjs) — route readiness,
#     zero console errors, layout sanity, server-side-everything, the core triage loop
#
# DETECTION (AUDIT.md C1): each job DETECTS its project and no-ops to green when absent, so
# jobs always run and stay valid as required status checks for branch protection (C2).
# Layout: backend in ./backend, scanner in ./scanner (uv + pyproject.toml, pyright as a
#         dev dep), frontend in ./frontend (npm + package.json).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    # AUDIT.md I12: conventional-commit types are load-bearing for release-please.
    # Validate every commit in the PR against commitlint.config.mjs. PR-only (commits on
    # main are already merged); merge commits are ignored by the action.
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read   # the action lists the PR's commits via the API
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  secret-scan:
    # Issue 552: gitleaks with the repo's own rules and allowlist (.gitleaks.toml) on every PR and
    # push. The WHOLE history is scanned each run (about 4 s for ~450 commits), so there is no
    # commit-range logic to get wrong. The pinned binary, not gitleaks-action, which needs a paid
    # license on organization repos. To bump: change both values below, the checksum taken from
    # the release's gitleaks_<version>_checksums.txt; a wrong one fails the download step.
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # the checksum of versions.yaml supply_chain.gitleaks's linux_x64 tarball; bump them together
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified)
        run: |
          GITLEAKS_VERSION=$(yq -r '.supply_chain.gitleaks' versions.yaml)
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  common:
    name: javv-common (shared lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - name: Install dependencies
        working-directory: libs/javv-common
        run: uv sync --all-extras --dev
      - name: Ruff lint
        working-directory: libs/javv-common
        run: uv run ruff check .
      - name: Ruff format
        working-directory: libs/javv-common
        run: uv run ruff format --check .
      - name: Pyright
        working-directory: libs/javv-common
        run: uv run pyright
      - name: Pytest
        working-directory: libs/javv-common
        run: uv run pytest

  backend-static:
    # S-2 (#221): ruff+pyright split from pytest — no service container, starts instantly,
    # fails fast on lint-only mistakes, and runs CONCURRENTLY with the pytest job below.
    # Always-run (detect-step, never `if:`-skipped) so it stays valid for branch protection (C2).
    name: Backend static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect backend
        id: detect
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/pyproject.toml yet — skipping backend gates (scaffold)."
          fi

      - name: Read uv pin from versions.yaml (D42)
        if: steps.detect.outputs.present == 'true'
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Ruff lint
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run ruff format --check .

      - name: Pyright
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv run pyright

      # Docs-drift gate (#410): API.md route table + CONFIGURATION.md env rows vs code, and
      # REPO-MAP.md naming every workflow, ci.yml job, script and standard
      - name: Docs drift
        if: steps.detect.outputs.present == 'true'
        run: bash development/scripts/check-docs-drift.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      # Real OpenSearch so the ingest/bootstrap integration tests (golden round-trip) run in CI,
      # not just locally. Security off — dev/CI only. Image kept in sync with versions.yaml (D42).
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          # fs snapshot repo root for the M2 restore drill — inside the data dir so it's writable
          # by the opensearch uid (a mounted volume would be root-owned). Matches the dev compose.
          path.repo: /usr/share/opensearch/data/snapshots
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the tags and origin/main: tests/test_mapping_additive.py and test_api_routes_kept.py
          # compare with the newest release and with the merge base (issue 261)
          fetch-depth: 0

      - name: Detect backend
        id: detect
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/pyproject.toml yet — skipping backend gates (scaffold)."
          fi

      - name: Read uv pin from versions.yaml (D42)
        if: steps.detect.outputs.present == 'true'
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: uv sync --all-extras --dev

      # ruff/pyright live in the parallel `backend-static` job (S-2, #221).
      # -n 2 (S-3): xdist across the 2 runner vCPUs — safe post-S-1 (session bootstrap;
      # tests use unique cluster_ids/usernames; prefix-isolated files stay isolated).
      # NOT in addopts — local single-process debugging stays the default.
      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        # store-exclusive tests (marker `serial`, e.g. the admin demote race that disables every
        # enabled admin) run AFTER the parallel pass, alone — under -n N they poison concurrent
        # tests' sessions (broke main 2026-07-07). A plain local `pytest` runs everything serially.
        # Coverage floor (#383): 92.4% lines measured 2026-07-15, floored at −2pts on the
        # parallel pass (the serial pass adds a sliver — the floor stays conservative).
        # Raise when coverage grows, never lower (docs/CONFIGURATION.md, "CI gate values").
        run: |
          uv run pytest -n 2 -m "not serial" --cov=src/backend --cov-fail-under=90
          uv run pytest -m serial

  app-images:
    # issue 452: the app's images build on every PR without being pushed, and each one starts and
    # answers: the backend against a real store, the frontend in front of it. A release publishes
    # them from release-please.yml. The backend runs on the dev profile with no secrets, which is what
    # proves the image itself needs none.
    name: App images
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # the release builds with this script too, so its tags and labels are checked on every PR
      - name: Build both images
        run: |
          development/scripts/build-app-images.sh > "$RUNNER_TEMP/refs.txt"
          echo "BACKEND_IMAGE=$(sed -n 1p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$(sed -n 2p "$RUNNER_TEMP/refs.txt")" >> "$GITHUB_ENV"

      - name: Each image carries its release, commit and source
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          for ref in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker image inspect -f '{{json .Config.Labels}}' "$ref" | jq -e --arg v "$version" \
              --arg sha "$(git rev-parse HEAD)" '
                ."org.opencontainers.image.version" == $v
                and ."org.opencontainers.image.revision" == $sha
                and (."org.opencontainers.image.source" | startswith("https://github.com/"))'
          done

      - name: Start the backend image against the store
        run: >-
          docker run -d --name javv-backend --network host
          -e JAVV_OPENSEARCH_URL=http://localhost:9200 -e JAVV_SCHEDULER_ENABLED=false
          "$BACKEND_IMAGE"

      # judged by body: a 200 from something else is not the backend answering
      - name: The backend is healthy and ready
        run: |
          for _ in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' javv-backend)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' javv-backend | grep -qx healthy
          curl -sf localhost:8000/healthz | jq -e '.status == "ok"'
          curl -sf localhost:8000/readyz | jq -e '.status == "ready"'

      - name: Start the frontend image in front of the backend
        run: >-
          docker run -d --name javv-frontend --network host
          -e JAVV_BACKEND_URL=http://localhost:8000
          "$FRONTEND_IMAGE"

      # the SPA for a history-mode route, a hashed asset that may be cached forever, and /readyz
      # answered by the backend through the frontend's forward
      - name: The frontend serves the app and forwards to the backend
        run: |
          for _ in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' javv-frontend)" = healthy ] && break
            sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' javv-frontend | grep -qx healthy
          curl -sf localhost:8080/ | grep -q '<div id="app">'
          curl -sf localhost:8080/findings | grep -q '<div id="app">'
          asset=$(curl -sf localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sfI "localhost:8080$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -sf localhost:8080/readyz | jq -e '.status == "ready"'

      - name: Container logs
        if: failure()
        run: |
          docker logs javv-backend
          docker logs javv-frontend

  compose:
    # issue 452: the whole stack from deploy/compose/compose.yaml, started the way the guide says,
    # signed in over plain http, then the backend stopped to prove the frontend answers 502 (which
    # the app reads as "backend down", not "store"). Issue 715: OpenSearch runs with its login on,
    # so the job also proves the store refuses an anonymous request and a wrong password stops the
    # backend with a message that says so. Issue 736: the demo setup's other users are gone.
    # Issue 729: the backend signs in as javv, which holds only the javv role, and the role walk
    # calls every surface that reaches OpenSearch as javv, then checks what the role refuses.
    # Issue 869: deploy/compose/setup.sh makes the .env, as the guide says. No secret is in this
    # job's env: compose takes a shell variable over .env, so one here would hide the file.
    name: Compose stack
    runs-on: ubuntu-latest
    env:
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: OpenSearch's memory map limit
        run: sudo sysctl -w vm.max_map_count=262144

      # built under the names the compose file uses, then started with no pull: a file that names
      # another registry or version fails here instead of on someone's machine. OpenSearch is the
      # one image that is pulled.
      - name: Build both images
        run: development/scripts/build-app-images.sh

      # its output holds the admin password: kept in a file, never in the log
      - name: Make .env with the setup script
        run: deploy/compose/setup.sh > setup.out

      - name: Start the stack
        run: |
          docker compose -f deploy/compose/compose.yaml pull opensearch
          docker compose -f deploy/compose/compose.yaml up -d --pull never --wait --wait-timeout 300

      # the password that the script showed, not the one in .env: the two must be the same
      - name: Sign in through the frontend over plain http
        run: |
          password=$(sed -n 's/^    //p' setup.out)
          echo "::add-mask::$password"
          curl -sf -c jar.txt -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}" \
            localhost:8080/auth/login | jq -e '.user.username == "admin" and .user.must_change'
          curl -sf -b jar.txt localhost:8080/auth/me | jq -e '.user.username == "admin"'

      # the later steps read the secrets that the script made, masked in the log from here on
      - name: The secrets of .env, for the later steps
        run: |
          while IFS='=' read -r key value; do
            case $key in
              JAVV_BOOTSTRAP_ADMIN_PASSWORD | JAVV_OPENSEARCH_ADMIN_PASSWORD | \
                JAVV_OPENSEARCH_PASSWORD)
                echo "::add-mask::$value"
                echo "$key=$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < deploy/compose/.env

      - name: OpenSearch refuses a request without its login
        run: |
          code=$(docker compose -f deploy/compose/compose.yaml exec -T opensearch \
            curl -sk -o /dev/null -w '%{http_code}' https://localhost:9200/)
          echo "status $code"
          [ "$code" = 401 ]

      # issue 736: the demo security setup's other users sign in with their names as passwords,
      # so the compose file keeps only admin, and adds javv (issue 729), in the users file
      # OpenSearch loads
      # Both logins reach curl the same way, as config on stdin, so the admin request (which must
      # succeed) proves that path carries a login: without it, readall's 401 could be a request
      # that sent none. sed escapes " and \ for curl's config, as the store's health check does.
      - name: OpenSearch's users are admin and javv
        run: |
          as() {  # $1 user:password, then curl's arguments; runs curl inside the store's container
            local login=$1; shift
            printf 'user = "%s"\n' "$(printf %s "$login" | sed 's/[\\"]/\\&/g')" |
              docker compose -f deploy/compose/compose.yaml exec -T opensearch curl -sk -K - "$@"
          }
          as "admin:$JAVV_OPENSEARCH_ADMIN_PASSWORD" -f \
            https://localhost:9200/_plugins/_security/api/internalusers | jq -e 'keys == ["admin", "javv"]'
          code=$(as readall:readall -o /dev/null -w '%{http_code}' https://localhost:9200/_search)
          echo "readall status $code"
          [ "$code" = 401 ]

      # compose interpolates one $ into the container's command, where docker inspect shows it
      - name: The store's health check leaves the password to the container's shell
        run: |
          check=$(docker inspect javv-opensearch-1 -f '{{json .Config.Healthcheck.Test}}')
          echo "$check" | grep -q '\$OPENSEARCH_INITIAL_ADMIN_PASSWORD'
          if echo "$check" | grep -qF "$JAVV_OPENSEARCH_ADMIN_PASSWORD"; then exit 1; fi

      - name: The backend never gets OpenSearch's admin password
        run: |
          if docker inspect javv-backend-1 -f '{{json .Config.Env}}' |
            grep -qF "$JAVV_OPENSEARCH_ADMIN_PASSWORD"; then
            echo "::error::the backend container carries the store's admin password"; exit 1
          fi

      # a seeded backend (two clusters, an inventory run), then every surface as javv
      - name: The javv role covers every surface, and refuses the rest
        shell: bash
        env:
          OS_EXEC: docker compose -f deploy/compose/compose.yaml exec -T opensearch
          RUN_JOB: docker compose -f deploy/compose/compose.yaml exec -T backend python -m
        run: |
          export BACKEND=http://localhost:8080 ADMIN_PW=ci-only-admin-rotated-729
          ADMIN_PW_INIT="$JAVV_BOOTSTRAP_ADMIN_PASSWORD" development/scripts/seed-smoke.sh
          OS_ADMIN_LOGIN="admin:$JAVV_OPENSEARCH_ADMIN_PASSWORD" \
            OS_JAVV_LOGIN="javv:$JAVV_OPENSEARCH_PASSWORD" \
            development/scripts/opensearch-role-walk.sh
          # nothing else the backend did along the way was refused: the walk's one deliberate
          # refusal (a search of a restored copy) must be in the log, so the check can see one
          refused=$(docker compose -f deploy/compose/compose.yaml logs backend |
            grep -E 'status:403|security_exception' || true)
          if ! grep -q 'restored-findings/_search' <<<"$refused"; then
            echo "::error::the walk's refusal is not in the backend's log"; exit 1
          fi
          if grep -v 'restored-findings/_search' <<<"$refused"; then
            echo "::error::OpenSearch refused the backend a call"; exit 1
          fi

      - name: A wrong OpenSearch password stops the backend and says so
        run: |
          set +e
          out=$(timeout 180 docker compose -f deploy/compose/compose.yaml run --rm --no-deps \
            -e JAVV_OPENSEARCH_PASSWORD=Wrong-OpenSearch-715! backend 2>&1)
          code=$?
          set -e
          echo "$out" | tail -5
          [ "$code" != 0 ] && [ "$code" != 124 ]
          echo "$out" | grep -q 'refused the credentials in JAVV_OPENSEARCH_USERNAME'
          if echo "$out" | grep -qF 'Wrong-OpenSearch-715!'; then exit 1; fi

      - name: A stopped backend is a 502 from the frontend, not the store's 503
        run: |
          docker compose -f deploy/compose/compose.yaml stop backend
          code=$(curl -s -o readyz.json -w '%{http_code}' localhost:8080/readyz)
          echo "status $code"
          [ "$code" = 502 ]
          jq -e '.status == 502 and .title == "Backend unavailable"' readyz.json

      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs

  # issue 725: the charts in deploy/helm, over two jobs that run side by side (issue 780: one job
  # holding all of it was the slowest in CI). ct install puts each chart in kind: every
  # ci/*-values.yaml is one install followed by the chart's `helm test`. The render checks are
  # backend/tests/test_helm_*.py, in the Backend job, and scanner/tests/test_helm_config.py, in the
  # Scanner job; backend/tests/test_ci_helm_jobs.py holds the split.
  helm-opensearch:
    # ct lint (yamllint, Chart.yaml, helm lint) and each chart's README against its values.yaml,
    # the release's package/push/pull, then ct install of javv-opensearch: the demo certificates,
    # a certificate from a Secret, and one from cert-manager.
    name: Helm lint, packaging and javv-opensearch
    runs-on: ubuntu-latest
    env:
      # OpenSearch's rules: 8+ characters with upper, lower, digit and special, and not a weak one
      JAVV_CI_OPENSEARCH_PASSWORD: Ci-only-OpenSearch-725!
      JAVV_CI_OPENSEARCH_BACKEND_PASSWORD: Ci-only-javv-729
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # chart-testing runs yamllint and yamale in Python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: ct lint
        run: ct lint --config deploy/helm/ct.yaml --all

      - name: Each chart's README matches its values.yaml
        run: development/scripts/helm-docs.sh --check

      # the release's packaging (release-please.yml, publish-charts) up to the push, against a
      # registry on this runner: the real scanner digests, each verified with cosign. So an outage
      # of ghcr or Sigstore fails this job, the cost of pinning only signed images.
      - name: The cosign version
        id: cosign
        run: echo "version=$(yq -r '.supply_chain.cosign' versions.yaml)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.cosign.outputs.version }}

      - name: The charts package, push, and pull back as the release does
        # GitHub's bash runs with pipefail, so a failed render fails the step
        shell: bash
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          docker run -d --rm --name charts-registry -p 127.0.0.1:5000:5000 registry:3.0.0
          development/scripts/publish-charts.sh package "$version" "$RUNNER_TEMP/charts"
          development/scripts/publish-charts.sh push "$RUNNER_TEMP/charts" oci://localhost:5000/charts \
            --plain-http > "$RUNNER_TEMP/pushed.txt"
          cat "$RUNNER_TEMP/pushed.txt"
          [ "$(wc -l < "$RUNNER_TEMP/pushed.txt")" -eq 3 ]
          mkdir -p "$RUNNER_TEMP/pulled"
          while read -r ref; do
            pulled=$(helm pull "oci://${ref%@*}" --version "$version" --plain-http \
              -d "$RUNNER_TEMP/pulled" 2>&1)
            [ "$(sed -n 's/^Digest: //p' <<<"$pulled")" = "${ref#*@}" ]
          done < "$RUNNER_TEMP/pushed.txt"
          helm template s oci://localhost:5000/charts/javv-scanner --version "$version" --plain-http \
            --set backendUrl=http://j:8080 --set trivy.token.value=t --set grype.token.value=g |
            sed -nE 's/^ +image: "?([^"]+)"?$/\1/p' | sort -u | tee "$RUNNER_TEMP/scanner-images.txt"
          # each scanner's image once, by digest; anything else, or nothing, fails
          pinned='^ghcr\.io/danube-labs/javv-scanner-(trivy|grype)@sha256:[0-9a-f]{64}$'
          if grep -vE "$pinned" "$RUNNER_TEMP/scanner-images.txt"; then
            echo "::error::the published javv-scanner names an image by tag"; exit 1
          fi
          [ "$(wc -l < "$RUNNER_TEMP/scanner-images.txt")" -eq 2 ]
          [ "$(cut -d@ -f1 "$RUNNER_TEMP/scanner-images.txt" | sort -u | wc -l)" -eq 2 ]
          docker stop charts-registry

      - name: OpenSearch's memory map limit
        run: sudo sysctl -w vm.max_map_count=262144

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-testing

      - name: ct install, javv-opensearch
        run: |
          development/scripts/helm-ci-fixtures.sh javv-ci
          ct install --config deploy/helm/ct.yaml --charts deploy/helm/javv-opensearch

      - name: Cluster state
        if: failure()
        run: |
          kubectl --context kind-chart-testing -n javv-ci get all,secrets,certificates,events || true
          kubectl --context kind-chart-testing -n javv-ci logs -l app.kubernetes.io/name=opensearch --all-containers --tail 100 || true
          df -h /

  helm-app:
    # javv: next to a store with a cert-manager certificate, on images built from this commit,
    # then a real sign-in, a stopped backend (502) and an upgrade with a rollback. javv-scanner:
    # in a second kind cluster that plays the monitored one, on the published scanner images,
    # pushing to that JAVV; one cycle of each scanner lands.
    name: Helm javv and javv-scanner
    runs-on: ubuntu-latest
    env:
      # OpenSearch's rules: 8+ characters with upper, lower, digit and special, and not a weak one
      JAVV_CI_OPENSEARCH_PASSWORD: Ci-only-OpenSearch-725!
      JAVV_CI_OPENSEARCH_BACKEND_PASSWORD: Ci-only-javv-729
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # chart-testing runs yamllint and yamale in Python
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: OpenSearch's memory map limit
        run: sudo sysctl -w vm.max_map_count=262144

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: chart-testing

      # built under the release's names, which the javv chart's values use, and imported straight
      # into the node's containerd: the images carry an attestation manifest, and an import that
      # misses one shows up only later, as ImagePullBackOff
      - name: The app images, built from this commit and loaded into kind
        run: |
          development/scripts/build-app-images.sh
          version=$(jq -r '."."' .release-please-manifest.json)
          for app in backend frontend; do
            docker save "ghcr.io/danube-labs/javv-$app:$version" |
              docker exec -i chart-testing-control-plane ctr -n k8s.io images import --all-platforms -
          done
          docker exec chart-testing-control-plane crictl images | grep "danube-labs/javv-"
          [ "$(docker exec chart-testing-control-plane crictl images | grep -c "danube-labs/javv-")" = 2 ]

      - name: A store for the app, with a cert-manager certificate
        run: |
          development/scripts/helm-ci-fixtures.sh javv
          helm install store deploy/helm/javv-opensearch -n javv --wait --timeout 10m \
            -f deploy/helm/javv-opensearch/ci/cert-manager-values.yaml

      # ct keeps the release (issue 780): the checks below and the scanners' JAVV run on it
      # rather than on a second install of the same values. ct names it after the chart plus a
      # random suffix.
      - name: ct install, javv
        run: |
          ct install --config deploy/helm/ct.yaml --charts deploy/helm/javv --namespace javv \
            --skip-clean-up
          release=$(development/scripts/helm-ci-release.sh kind-chart-testing javv javv)
          echo "JAVV_CI_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Sign-in, a stopped backend, upgrade and rollback
        env:
          JAVV_CI_ADMIN_PASSWORD: ci-only-admin-passphrase
        run: |
          development/scripts/helm-ci-app-checks.sh javv "$JAVV_CI_RELEASE" \
            deploy/helm/javv/ci/default-values.yaml

      # a cluster of its own, as a monitored cluster is: the scanners reach JAVV at the first
      # cluster's node address on the kind network. It becomes the current context.
      - name: A second kind cluster, the monitored one
        run: kind create cluster --name monitored --wait 2m

      - name: ct install, javv-scanner, pushing to that JAVV
        env:
          JAVV_CI_ADMIN_PASSWORD: ci-only-admin-passphrase
        run: |
          url=$(development/scripts/helm-ci-scanner-checks.sh prepare \
            kind-chart-testing javv "$JAVV_CI_RELEASE" kind-monitored javv-scan | tail -n 1)
          echo "JAVV_CI_BACKEND_URL=$url" >> "$GITHUB_ENV"
          ct install --config deploy/helm/ct.yaml --charts deploy/helm/javv-scanner \
            --namespace javv-scan --helm-extra-set-args "--set=backendUrl=$url" --skip-clean-up
          release=$(development/scripts/helm-ci-release.sh kind-monitored javv-scan javv-scanner)
          echo "JAVV_CI_SCANNER_RELEASE=$release" >> "$GITHUB_ENV"

      # on the release ct kept, whose vuln DB refresh at install has already started
      - name: A cycle of each scanner lands in JAVV
        env:
          JAVV_CI_ADMIN_PASSWORD: ci-only-admin-passphrase
        run: |
          development/scripts/helm-ci-scanner-checks.sh cycle \
            kind-monitored javv-scan "$JAVV_CI_SCANNER_RELEASE" "$JAVV_CI_BACKEND_URL"
          df -h /

      # issue 729: the backend signed in as javv through every step above; nothing it did was
      # refused (the store's own helm test checks javv's role and a refusal)
      - name: OpenSearch refused the backend nothing
        shell: bash
        run: |
          if kubectl --context kind-chart-testing -n javv logs "deploy/$JAVV_CI_RELEASE-backend" |
            grep -E 'status:403|security_exception'; then
            echo "::error::OpenSearch refused the backend a call"; exit 1
          fi

      - name: Cluster state
        if: failure()
        run: |
          kubectl --context kind-chart-testing -n javv get all,secrets,certificates,events || true
          kubectl --context kind-chart-testing -n javv logs -l app.kubernetes.io/name=opensearch --all-containers --tail 100 || true
          kubectl --context kind-chart-testing -n javv logs -l app.kubernetes.io/name=javv --all-containers --tail 100 || true
          kubectl --context kind-monitored -n javv-scan get all,pvc,events || true
          kubectl --context kind-monitored -n javv-scan logs -l app.kubernetes.io/name=javv-scanner --all-containers --tail 100 || true
          df -h /

  scanner:
    name: Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect scanner
        id: detect
        run: |
          if [ -f scanner/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scanner/pyproject.toml yet — skipping scanner gates (scaffold)."
          fi

      - name: Read uv pin from versions.yaml (D42)
        if: steps.detect.outputs.present == 'true'
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: scanner
        run: uv sync --all-extras --dev

      - name: Ruff lint
        if: steps.detect.outputs.present == 'true'
        working-directory: scanner
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.detect.outputs.present == 'true'
        working-directory: scanner
        run: uv run ruff format --check .

      - name: Pyright
        if: steps.detect.outputs.present == 'true'
        working-directory: scanner
        run: uv run pyright

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: scanner
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet — skipping frontend gates (scaffold)."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test (with coverage floor, #383)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:ci

      # I4/I7 contract gate: the committed schema snapshot must match the backend code, and the
      # committed generated client must match the snapshot — a backend Pydantic/route change
      # without `python -m backend.tools.export_openapi frontend/openapi.json` + `npm run gen:api`
      # breaks the build here, not at runtime.
      - name: Set up uv (contract gate)
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Contract gate — schema snapshot matches backend code
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: |
          uv sync --all-extras --dev
          uv run python -m backend.tools.export_openapi ../frontend/openapi.json
          git diff --exit-code ../frontend/openapi.json \
            || { echo '::error::frontend/openapi.json is stale — run: (cd backend && uv run python -m backend.tools.export_openapi ../frontend/openapi.json)'; exit 1; }

      - name: Contract gate — generated client matches the schema
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/generated \
            || { echo '::error::src/api/generated is stale — run: (cd frontend && npm run gen:api)'; exit 1; }

  frontend-smoke:
    # The #383 route smoke (testing.md §4): the BUILT app against a live, fixture-seeded
    # backend, walked headless through every route by frontend/scripts/ci-smoke.mjs.
    # Desktop-only by ruling (#387 — no phone layout exists yet); the same walk module
    # drives the local authoring rig (visual-capture.mjs), so selectors live in ONE place.
    name: Frontend smoke
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/package.json yet — skipping the smoke (scaffold)."
          fi

      - name: Read uv pin from versions.yaml (D42)
        if: steps.detect.outputs.present == 'true'
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      - name: Start backend
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        # JAVV_MAX_CONCURRENT_PITS_PER_PRINCIPAL raised: the walk hops routes faster than a
        # human and PIT slots free themselves slower than it navigates (docs/CONFIGURATION.md)
        env:
          JAVV_ENV: dev
          JAVV_BOOTSTRAP_ADMIN_USERNAME: admin
          JAVV_BOOTSTRAP_ADMIN_PASSWORD: ci-smoke-initial-pw
          JAVV_MAX_CONCURRENT_PITS_PER_PRINCIPAL: "50"
          # the walk checks seeded data; a sweep landing mid-walk would change it (issue 691)
          JAVV_SCHEDULER_ENABLED: "false"
        # the log goes where the e2e rigs read it: tests/e2e/beacon.spec.ts asserts on its lines
        run: |
          uv sync --all-extras --dev
          mkdir -p ../development/e2e/logs
          nohup uv run uvicorn backend.main:app --port 8000 > ../development/e2e/logs/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && break || sleep 2
          done
          curl -sf http://localhost:8000/healthz || { cat ../development/e2e/logs/backend.log; exit 1; }

      - name: Seed the corpus (golden fixture)
        if: steps.detect.outputs.present == 'true'
        env:
          ADMIN_PW_INIT: ci-smoke-initial-pw
          ADMIN_PW: ci-smoke-rotated-pw
          # the capability-less viewer the /inspect gate spec logs in as (issue 460); passed
          # explicitly rather than leaning on the script's defaults so the two cannot drift
          VIEWER_USER: smoke-viewer
          VIEWER_PW_INIT: ci-smoke-viewer-init
          VIEWER_PW: ci-smoke-viewer-pw
        run: ./development/scripts/seed-smoke.sh

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build + preview
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run build
          nohup npm run preview -- --port 4173 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:4173/ >/dev/null && break || sleep 2
          done

      - name: Route smoke (walk every screen, core triage loop)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        env:
          JAVV_BASE: http://localhost:4173
          JAVV_USER: admin
          JAVV_PASS: ci-smoke-rotated-pw
        run: node scripts/ci-smoke.mjs --core-loop

      - name: E2E smoke suite (login, triage round-trip, degraded banner, paging, /inspect loops, beacon)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        env:
          JAVV_BASE: http://localhost:4173
          JAVV_USER: admin
          JAVV_PASS: ci-smoke-rotated-pw
          JAVV_VIEWER_USER: smoke-viewer
          JAVV_VIEWER_PASS: ci-smoke-viewer-pw
        run: npx playwright test

      - name: Backend log on failure
        if: failure() && steps.detect.outputs.present == 'true'
        run: tail -100 development/e2e/logs/backend.log

      # the record of a failed run (issue 786): the smoke's trace, the e2e suite's traces and the
      # whole backend log, whose last 100 lines above can miss the moment of the failure
      - name: Upload the failure record
        if: failure() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-smoke-failure
          path: |
            development/e2e/logs/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  docs-site:
    # Issue 639: the operator docs site builds with --strict, which fails on a link to a page the
    # site doesn't publish. Always runs, like every job here, so it can be a required check.
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - name: Strict build
        run: uv run --project docs-site --frozen zensical build -f docs-site/mkdocs.yml --strict
      - name: The theme's own files were written, and code blocks and diagrams render
        # the strict build passes without any of them: pages with no styling, every fenced block
        # flattened into inline code, or a mermaid diagram shown as its source (issue 639)
        run: |
          ls docs-site/site/assets/stylesheets/modern/main.*.min.css
          grep -q '<pre' docs-site/site/docs/DEPLOYING/index.html
          grep -q '<pre class="mermaid">' docs-site/site/docs/DEPLOYING/index.html
      - name: No list on the site rendered as a paragraph
        # the strict build passes a list GitHub nests with 3 spaces, which the site shows as text
        run: python3 development/scripts/check-docs-site-lists.py docs-site/site

  dependency-audit:
    # Issue 552: pip-audit (backend, scanner, libs) and npm audit (frontend) on every PR and push.
    # REPORT-ONLY by operator ruling: the findings land in this job's summary, split production vs
    # dev-only, and the job never fails (development/standards/dependency-policy.md). The same
    # script runs locally.
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Audit dependencies (report-only)
        run: development/scripts/dependency-audit.sh >> "$GITHUB_STEP_SUMMARY"
