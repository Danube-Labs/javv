name: Clock drift

# Date bombs (issue 533, testing.md "No fixed date where code compares it to the real clock"): a
# fixed date in test data, compared against the real clock, passes today and fails on a calendar
# day nobody chose. This runs both suites with the process clock shifted forward (libfaketime), so
# one inside the horizon fails here, on a schedule, instead of on main on a random morning.
#
# Horizons are the ones measured clean before this landed (issue 533 spike, PR 565): backend +90d
# with OpenSearch left on real time (the skew between the two sides produced no failures at that
# distance, untested beyond it), frontend +365d (Vitest has no store to skew against).
# libfaketime is a runner apt package, not a project dependency. `faketime -f` is required: the
# wrapper's plain form parses its argument with GNU `date`, which rejects '+90d'.
#
# A red run is a finding, not a flake to re-run: the failing test holds a fixed date that code
# compares against the clock — fix it per testing.md, never by widening a window.

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
  # exercise the workflow itself whenever it changes, so an edit is proven before it merges
  pull_request:
    paths:
      - '.github/workflows/clock-drift.yml'

permissions:
  contents: read

concurrency:
  group: clock-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend at +90 days
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # same service as ci.yml's Backend job; the image is kept in sync with versions.yaml (D42)
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          path.repo: /usr/share/opensearch/data/snapshots
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the tags and origin/main: tests/test_mapping_additive.py and test_api_routes_kept.py
          # compare with the newest release and with the merge base (issue 261)
          fetch-depth: 0

      - name: Install libfaketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true

      # on the real clock — only the tests run shifted
      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      # ci.yml's split (serial-marked tests alone, after the parallel pass), no coverage floor
      - name: Pytest at +90 days
        working-directory: backend
        run: |
          faketime -f '+90d' date -u
          faketime -f '+90d' uv run pytest -n 2 -m "not serial"
          faketime -f '+90d' uv run pytest -m serial

  frontend:
    name: Frontend at +365 days
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install libfaketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # on the real clock — only the tests run shifted
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test at +365 days
        working-directory: frontend
        run: |
          faketime -f '+365d' date -u
          faketime -f '+365d' npm run test:ci
