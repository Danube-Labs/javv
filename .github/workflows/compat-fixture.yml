name: Compat fixture

# Copies the scanner compatibility gate's fixture image into our own registry (issue 631), so the
# gate and the ingest round trip don't depend on Docker Hub still serving it. The copy is by
# digest, so it keeps the same digest: `COMPAT_IMAGE` in scanner/src/scanner/compat.py pins it.
# Run by hand, once and again only if the copy is lost. GHCR creates the package private; it must
# be made public in the package settings before CI can pull it without a login.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE: docker.io/library/python:3.9.16-slim@sha256:5cde4e147c4165ad8dbf8a4df9631863766eeb0b79b890fafe6885b3b127af74
  TARGET: ghcr.io/danube-labs/javv-compat-fixture:python-3.9.16-slim

jobs:
  copy:
    name: Copy the fixture by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy, then prove the digest survived
        run: |
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          want="${SOURCE##*@}"
          got=$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}' | jq -r .digest)
          echo "source $want"; echo "copy   $got"
          [ "$got" = "$want" ] || { echo "::error::the copy's digest differs from the pinned source"; exit 1; }
