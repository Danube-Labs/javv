name: Docs site

# Issue 639: publishes the `dev` version of the operator docs site, built from main, to the
# gh-pages branch that GitHub Pages serves. mike keeps one folder per version there; release-please
# publishes the numbered versions. The paths are every file docs-site/src/ links to, plus the
# config, the tooling and README.md, whose supported-versions table the site includes
# (backend/tests/test_docs_site.py holds the list in step).

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/*.md
      - docs/runbooks/*.md
      - docs/use/**
      - docs/ingest-envelope.schema.json
      - SECURITY.md
      - CHANGELOG.md
      - README.md
      - versions.yaml
      - deploy/compose/compose.yaml
      - deploy/helm/*/README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-publish
  cancel-in-progress: false

jobs:
  dev:
    name: Publish dev docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike commits the built site to gh-pages and pushes it
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - name: Deploy dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # mike commits on top of gh-pages; the branch is absent only before the first publish
          git fetch origin gh-pages:gh-pages || true
          uv run --project docs-site --frozen mike deploy --config-file docs-site/mkdocs.yml --push dev
          # the site opens on dev until a release publishes `latest` (issue 639, decision 2)
          if ! uv run --project docs-site --frozen mike list --config-file docs-site/mkdocs.yml | grep -q '\[latest\]'; then
            uv run --project docs-site --frozen mike set-default --config-file docs-site/mkdocs.yml --push dev
          fi
