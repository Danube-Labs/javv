name: release-please

# Maintains a standing "release PR" that accumulates conventional-commit changelog
# entries + the next SemVer bump. Merging that PR cuts the tag, GitHub Release, and
# CHANGELOG, then publishes the app images and the three charts, signed. While the PR is open, a
# job regenerates its chart READMEs. See development/standards/releases.md.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag, GitHub Release, CHANGELOG
      pull-requests: write   # the standing release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Manifest mode: reads release-please-config.json + .release-please-manifest.json.
          # Uses the default GITHUB_TOKEN. NOTE: PRs opened with GITHUB_TOKEN do not
          # trigger other workflows (e.g. CI), so the release PR is closed and reopened to run
          # CI (releases.md); an App token here would remove that step.
          token: ${{ secrets.GITHUB_TOKEN }}

  # issue 752: release-please moves each Chart.yaml and the javv chart's image tags, not the READMEs
  # helm-docs writes from them, so its PR would fail CI's README check. This regenerates them on the
  # release PR's own branch. A GITHUB_TOKEN push starts no workflow, as release-please's own don't.
  chart-readmes:
    name: Chart READMEs on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Regenerate the chart READMEs
        run: development/scripts/helm-docs.sh

      - name: Push them if they changed
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          git diff --quiet -- 'deploy/helm/*/README.md' && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/helm/*/README.md
          git commit -m "docs: the chart readmes show the release's version"
          git push origin "HEAD:$BRANCH"

  # issue 452: a release publishes the backend and frontend images under its version. This runs here,
  # off release-please's output, because the tag release-please pushes is made with GITHUB_TOKEN and
  # starts no workflow of its own. The release PR has already moved the compose file to these tags,
  # so a publish that does not happen fails this run and says so on the release.
  publish-app-images:
    name: Publish app images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the note on the release when the publish fails
      packages: write
      id-token: write   # keyless cosign: the signing certificate comes from this job's OIDC token
    outputs:
      backend-digest: ${{ steps.push.outputs.backend }}
      frontend-digest: ${{ steps.push.outputs.frontend }}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: The release's compose file names the images this run builds
        id: vars
        run: |
          registry="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          [ "$(jq -r '."."' .release-please-manifest.json)" = "$VERSION" ]
          for app in backend frontend; do
            named=$(yq -r ".services.$app.image" deploy/compose/compose.yaml)
            [ "$named" = "$registry/javv-$app:$VERSION" ] || {
              echo "::error::compose.yaml names '$named' for $app, this release builds $registry/javv-$app:$VERSION"
              exit 1
            }
          done

      # before the build: a private package must read as published, not as missing (issue 833)
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # issue 833, B4: a re-run after a failed signature must sign what the first run published.
      # A tag already in the registry is pulled, not built again: a build is not reproducible, and
      # a second push would move the tag and leave the first digest public and unsigned
      - name: Build the images not yet published
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: development/scripts/release-app-images.sh prepare "$RUNNER_TEMP/app-images"

      # the release's own compose file, on the images just built or pulled: nothing is pushed or
      # signed unless they run
      - name: Smoke the release's compose file
        env:
          JAVV_SECRET_KEY: release-smoke-only-secret-key
          JAVV_BOOTSTRAP_ADMIN_PASSWORD: release-smoke-only-passphrase
          JAVV_OPENSEARCH_ADMIN_PASSWORD: Release-smoke-OpenSearch-715!
          JAVV_OPENSEARCH_PASSWORD: Release-smoke-javv-729
          JAVV_SESSION_COOKIE_SECURE: "false"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose -f deploy/compose/compose.yaml pull opensearch
          docker compose -f deploy/compose/compose.yaml up -d --pull never --wait --wait-timeout 300
          curl -sf localhost:8080/ | grep -q '<div id="app">'
          curl -sf localhost:8080/readyz | jq -e '.status == "ready"'
          docker compose -f deploy/compose/compose.yaml down -v

      # the digests are what gets signed, so they come from the registry, not the local store
      - name: Push both images
        id: push
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
        run: |
          echo "### App images for $TAG" >> "$GITHUB_STEP_SUMMARY"
          development/scripts/release-app-images.sh push "$RUNNER_TEMP/app-images" > "$RUNNER_TEMP/pushed.txt"
          cat "$RUNNER_TEMP/pushed.txt" >> "$GITHUB_OUTPUT"
          sed 's/^\([a-z]*\)=\(.*\)$/- `\1`: `\2`/' "$RUNNER_TEMP/pushed.txt" >> "$GITHUB_STEP_SUMMARY"

      # issue 615: an SBOM, a keyless signature and a signed SBOM attestation for each pushed digest,
      # as the scanner images have (issue 74). A tag can be moved; the digest is what was pushed.
      # by digest (versions.yaml `tag@sha256:`): this job can sign, so it runs no tag that can move
      - name: Install syft (versions.yaml, from its official image, by digest)
        run: |
          syft=$(yq -r '.supply_chain.syft' versions.yaml)
          cid=$(docker create "anchore/syft:$syft")
          docker cp "$cid:/syft" syft && docker rm "$cid" >/dev/null
          sudo install -m 0755 syft /usr/local/bin/syft && rm syft

      - name: An SBOM of each pushed digest
        id: sbom
        env:
          BACKEND: ${{ steps.push.outputs.backend }}
          FRONTEND: ${{ steps.push.outputs.frontend }}
        run: |
          mkdir -p sbom
          : > "$RUNNER_TEMP/to-sign.txt"
          for app in backend frontend; do
            ref=$BACKEND; [ "$app" = frontend ] && ref=$FRONTEND
            syft "$ref" -o spdx-json="sbom/javv-$app.spdx.json"
            echo "$ref sbom/javv-$app.spdx.json" >> "$RUNNER_TEMP/to-sign.txt"
          done
          {
            echo "images<<EOF_IMAGES"
            cat "$RUNNER_TEMP/to-sign.txt"
            echo "EOF_IMAGES"
          } >> "$GITHUB_OUTPUT"
          echo "cosign=$(yq -r '.supply_chain.cosign' versions.yaml)" >> "$GITHUB_OUTPUT"

      - name: Sign and attest each pushed image (cosign keyless)
        uses: ./.github/actions/sign-image
        with:
          images: ${{ steps.sbom.outputs.images }}
          cosign-version: ${{ steps.sbom.outputs.cosign }}

      # a new package can start private, and a private image breaks every deployment that pulls it
      - name: Anyone can pull them
        env:
          BACKEND: ${{ steps.push.outputs.backend }}
          FRONTEND: ${{ steps.push.outputs.frontend }}
        run: |
          docker logout ghcr.io
          for ref in "$BACKEND" "$FRONTEND"; do
            docker buildx imagetools inspect "$ref" >/dev/null || {
              echo "::error::$ref cannot be pulled without signing in: make the package public, then re-run the failed jobs"
              exit 1
            }
          done

      # what docs/DEPLOYING.md tells an operator to run, still signed out
      - name: Anyone can verify them
        env:
          BACKEND: ${{ steps.push.outputs.backend }}
          FRONTEND: ${{ steps.push.outputs.frontend }}
          IDENTITY: '^https://github\.com/Danube-Labs/javv-poc/\.github/workflows/release-please\.yml@refs/heads/main$'
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          for ref in "$BACKEND" "$FRONTEND"; do
            cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" >/dev/null
            cosign verify-attestation "$ref" --type spdxjson --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" >/dev/null
            echo "verified: $ref, its signature and its SBOM attestation"
          done

      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs || true

      # a failure after the push leaves the images public: the note must not say they were not
      # published, and the re-run signs those same digests (issue 833, B4)
      - name: Say on the release that its images were not published, or not signed
        if: failure()
        env:
          PUSHED: ${{ steps.push.outcome == 'success' }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            if [ "$PUSHED" = true ]; then
              echo "> **The images for this release were published but are not signed and verified yet.** See $run_url;"
              echo "> once it is fixed, re-run the failed jobs there: the re-run signs the images already"
              echo "> published, it does not build them again. Then delete this note."
            else
              echo "> **The images for this release were not published and signed.** See $run_url; once it is fixed,"
              echo "> re-run the failed jobs there and delete this note."
            fi
            echo
            gh release view "$TAG" --json body -q .body
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # issue 725, slice 4: the three charts, published as OCI artifacts next to the images they run and
  # signed the same way. After the images: no chart is published for images that were not.
  publish-charts:
    name: Publish charts
    needs: [release-please, publish-app-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the note on the release when the publish fails
      packages: write
      id-token: write   # keyless cosign: the signing certificate comes from this job's OIDC token
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Where the charts go, and the cosign version
        id: vars
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "registry=oci://ghcr.io/$owner/charts" >> "$GITHUB_OUTPUT"
          echo "cosign=$(yq -r '.supply_chain.cosign' versions.yaml)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v${{ steps.vars.outputs.cosign }}

      # checks each chart's version, and pins the scanner images by the digests their tags name
      # now, each verified as built by scanner-images.yml
      - name: Package the charts
        run: development/scripts/publish-charts.sh package "$VERSION" "$RUNNER_TEMP/charts"

      # docker's login is the one cosign reads; helm keeps its own
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the charts
        id: push
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          development/scripts/publish-charts.sh push "$RUNNER_TEMP/charts" "$REGISTRY" > "$RUNNER_TEMP/pushed.txt"
          {
            echo "charts<<EOF_CHARTS"
            cat "$RUNNER_TEMP/pushed.txt"
            echo "EOF_CHARTS"
          } >> "$GITHUB_OUTPUT"
          echo "### Charts for $TAG" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/pushed.txt" >> "$GITHUB_STEP_SUMMARY"

      # a chart holds no packages, so it gets a signature and no SBOM; the digest rule is the one
      # .github/actions/sign-image keeps for images
      - name: Sign each pushed chart (cosign keyless)
        env:
          CHARTS: ${{ steps.push.outputs.charts }}
        run: |
          signed=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              *@sha256:*) ;;
              *) echo "::error::$ref is not pinned by digest"; exit 1 ;;
            esac
            cosign sign --yes "$ref"
            signed=$((signed + 1))
          done <<< "$CHARTS"
          [ "$signed" -eq 3 ] || { echo "::error::signed $signed charts, not 3"; exit 1; }

      # what docs/DEPLOYING.md tells an operator to run, signed out. A new package can start private.
      - name: Anyone can pull and verify them
        env:
          CHARTS: ${{ steps.push.outputs.charts }}
          IDENTITY: '^https://github\.com/Danube-Labs/javv-poc/\.github/workflows/release-please\.yml@refs/heads/main$'
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          helm registry logout ghcr.io
          docker logout ghcr.io
          mkdir -p "$RUNNER_TEMP/pulled"
          while read -r ref; do
            [ -n "$ref" ] || continue
            pulled=$(helm pull "oci://${ref%@*}" --version "$VERSION" -d "$RUNNER_TEMP/pulled" 2>&1) || {
              echo "$pulled"
              echo "::error::${ref%@*} cannot be pulled without signing in: make the package public, then re-run the failed jobs"
              exit 1
            }
            [ "$(sed -n 's/^Digest: //p' <<<"$pulled")" = "${ref#*@}" ] || {
              echo "::error::${ref%@*}:$VERSION is not the digest just pushed"; exit 1
            }
            cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" >/dev/null
            echo "pulled and verified: $ref"
          done <<< "$CHARTS"

      - name: Say on the release that its charts were not published
        if: failure()
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "> **The Helm charts for this release were not published and signed.** See $run_url; once"
            echo "> it is fixed, re-run the failed jobs there and delete this note."
            echo
            gh release view "$TAG" --json body -q .body
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # issue 639: a release publishes its operator docs as a numbered version (`0.7`) on the gh-pages
  # branch that GitHub Pages serves, and moves `latest`, which the site opens on, to it. It runs
  # after the charts, so `latest` names a release that can be installed. `latest` is a redirect
  # page per page, not a symlink; docs.yml stops making `dev` the default once `latest` exists.
  publish-docs:
    name: Publish docs
    needs: [release-please, publish-charts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: docs-site-publish # docs.yml's: one job at a time pushes gh-pages
      cancel-in-progress: false
    permissions:
      contents: write # mike commits the built site to gh-pages and pushes it
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - name: Deploy the release's version as latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          minor="${VERSION%.*}"
          uv run --project docs-site --frozen mike deploy --config-file docs-site/mkdocs.yml \
            --push --update-aliases --alias-type=redirect "$minor" latest
          uv run --project docs-site --frozen mike set-default --config-file docs-site/mkdocs.yml \
            --push latest
