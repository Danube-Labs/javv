name: Scanner images

# M0b / D41: build the self-built, pinned scanner images across the compatible version matrix,
# gate each on the compatibility check (real binary → JAVV adapters) and the ingest round trip
# (the same scan pushed through a real backend, the store checked against it; issue 631), and
# publish the green ones to GHCR. Both run on PRs touching the scanner or the ingest path. Publish runs on every merge
# to main that changes what goes into an image, so every version versions.yaml lists as supported
# has a signed image (operator, 2026-09-29), plus a `scanner-v*` tag or manual dispatch.
# Versions come from versions.yaml (single source, D42).

on:
  pull_request:
    paths:
      - 'versions.yaml'
      - 'scanner/Dockerfile.*'
      - 'scanner/docker-bake.hcl'
      - 'scanner/src/**'
      - 'libs/**'
      - '.github/workflows/scanner-images.yml'
      - 'development/scripts/check-ingest-roundtrip.sh'
      # the backend side of the round trip; PR-only, so a backend merge never republishes images
      - 'backend/src/backend/models/envelope.py'
      - 'backend/src/backend/routers/ingest.py'
      - 'backend/src/backend/services/ingest.py'
      - 'backend/src/backend/routers/scan_runs.py'
      - 'backend/src/backend/routers/inventory_runs.py'
      - 'backend/src/backend/core/bootstrap.py'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
  workflow_dispatch:
  push:
    tags: ['scanner-v*']
    branches: [main]
    # what ends up inside an image, or decides how it is built and signed (GitHub skips path
    # filters for tag pushes, so a scanner-v* tag always publishes)
    paths:
      - 'versions.yaml'
      - 'scanner/Dockerfile.*'
      - 'scanner/docker-bake.hcl'
      - 'scanner/src/**'
      - 'scanner/pyproject.toml'
      - 'scanner/uv.lock'
      - 'libs/javv-common/src/**'
      - 'libs/javv-common/pyproject.toml'
      - '.github/workflows/scanner-images.yml'
      - '.github/actions/sign-image/**'

permissions:
  contents: read

jobs:
  matrix:
    name: Resolve compatible versions
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: gen
        run: |
          include=$(yq -o=json versions.yaml | jq -c \
            '[.scanners | to_entries[] | .key as $s
              | ([.value.current] + (.value.also_supported // []))[] | {scanner:$s, version:.}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "compatible-versions matrix: $include"

  compat:
    name: Compatibility ${{ matrix.scanner }} ${{ matrix.version }}
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Binaries come out of the vendors' official images (what the scanner Dockerfiles copy
      # from), not a piped install script.
      - name: Install trivy ${{ matrix.version }}
        if: matrix.scanner == 'trivy'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          cid=$(docker create "aquasec/trivy:${VERSION}")
          docker cp "$cid:/usr/local/bin/trivy" trivy && docker rm "$cid" >/dev/null
          sudo install -m 0755 trivy /usr/local/bin/trivy && rm trivy
      - name: Install grype ${{ matrix.version }}
        if: matrix.scanner == 'grype'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          cid=$(docker create "anchore/grype:v${VERSION}")
          docker cp "$cid:/grype" grype && docker rm "$cid" >/dev/null
          sudo install -m 0755 grype /usr/local/bin/grype && rm grype
      - name: Read uv pin from versions.yaml (D42)
        id: uv
        run: echo "version=$(yq -r '.toolchain.uv' versions.yaml)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - name: Install scanner package
        working-directory: scanner
        run: uv sync --all-extras --dev
      - name: Compatibility gate (real binary → JAVV adapters)
        working-directory: scanner
        run: uv run python -m scanner.compat --scanner "${{ matrix.scanner }}"
      # issue 631: the gate above stops at a locally built envelope. Push the same scan through the
      # real cycle into a real backend, then check the store holds exactly what was sent.
      - name: Start the backend
        working-directory: backend
        env:
          JAVV_OPENSEARCH_URL: http://localhost:9200
        run: |
          uv sync --frozen
          nohup uv run --no-sync uvicorn backend.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:8000/readyz >/dev/null && exit 0; sleep 2; done
          echo "::error::backend never became ready"; exit 1
      - name: Ingest round trip (real cycle → backend → store)
        env:
          JAVV_OPENSEARCH_URL: http://localhost:9200
          JAVV_BACKEND_URL: http://localhost:8000
          JAVV_CLUSTER_ID: javv-compat-ci
          SCANNER: ${{ matrix.scanner }}
        run: |
          token=$(cd backend && uv run --no-sync python -m backend.core.tokens \
            --cluster "$JAVV_CLUSTER_ID" --scanner "$SCANNER" | tail -1)
          echo "::add-mask::$token"
          (cd scanner && JAVV_TOKEN="$token" JAVV_DEAD_LETTER="$RUNNER_TEMP/dead-letter.jsonl" \
            uv run python -m scanner.compat --scanner "$SCANNER" --push --summary "$RUNNER_TEMP/summary.json")
          development/scripts/check-ingest-roundtrip.sh "$RUNNER_TEMP/summary.json" http://localhost:9200
      - name: Backend log
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/backend.log" || true

  lint-dockerfiles:
    name: Dockerfiles (lint, non-root, read-only smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build --check (both scanner Dockerfiles)
        working-directory: scanner
        run: |
          docker build --check -f Dockerfile.trivy ..
          docker build --check -f Dockerfile.grype ..
      # publish only runs on main, so this is the PR-time proof the images run as the chart will:
      # the fixed non-root user, a read-only root, and writes only where the Dockerfiles allow
      - name: Non-root user + read-only smoke (both images)
        run: |
          for scanner in trivy grype; do
            docker build -q -f "scanner/Dockerfile.$scanner" -t "smoke-$scanner" . >/dev/null
            user=$(docker image inspect -f '{{.Config.User}}' "smoke-$scanner")
            [ "$user" = "65532:65532" ] || { echo "::error::javv-scanner-$scanner runs as '$user', want 65532:65532"; exit 1; }
            docker run --rm --read-only --tmpfs /tmp \
              --tmpfs /var/cache/javv:uid=65532,gid=65532 --tmpfs /var/lib/javv:uid=65532,gid=65532 \
              --entrypoint python "smoke-$scanner" -m scanner.compat --scanner "$scanner"
          done

  publish:
    name: Build + publish compatible images
    needs: [compat, lint-dockerfiles]
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # one publish at a time: two merges in a row must not interleave their pushes of the moving
    # :<ver> tags. A running publish is never cancelled; of the runs waiting behind it GitHub keeps
    # only the newest, so the tags always end on the last merge's build.
    concurrency:
      group: scanner-images-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign: the signing certificate comes from this job's OIDC token
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve registry + versions from the source of truth
        id: vars
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          json=$(yq -o=json versions.yaml)
          echo "trivy=$(echo "$json" | jq -r '([.scanners.trivy.current] + (.scanners.trivy.also_supported // [])) | join(",")')" >> "$GITHUB_OUTPUT"
          echo "grype=$(echo "$json" | jq -r '([.scanners.grype.current] + (.scanners.grype.also_supported // [])) | join(",")')" >> "$GITHUB_OUTPUT"
      # Build LOCALLY first (--load), smoke the actual image, and only push if the smoke passes —
      # a broken image never gets a public tag (M0b). --load needs single-platform (amd64), which we are.
      # --allow=fs.read=..: the bake context is the repo root (images need libs/javv-common);
      # buildx ≥0.17 (runner drift, 2026-07-07) enforces fs entitlements outside the bake-file dir
      - name: Bake the compatible matrix locally
        working-directory: scanner
        run: docker buildx bake --allow=fs.read=.. -f docker-bake.hcl --load
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TRIVY_VERSIONS: ${{ steps.vars.outputs.trivy }}
          GRYPE_VERSIONS: ${{ steps.vars.outputs.grype }}
          GIT_SHA: ${{ steps.vars.outputs.sha }}

      # Publish-smoke (M0b DoD): run the *built* image's entrypoint end-to-end — this exercises the
      # image's real scanner binary + python package + setup, which the compat gate (runner-side) does
      # NOT. `scanner.compat` drives the real binary and asserts a valid envelope. Runs BEFORE push.
      - name: Publish-smoke each built image
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
        run: |
          json=$(yq -o=json versions.yaml)
          for scanner in trivy grype; do
            for v in $(echo "$json" | jq -r "([.scanners.$scanner.current] + (.scanners.$scanner.also_supported // []))[]"); do
              ref="$REGISTRY/javv-scanner-$scanner:$v"
              echo "::group::smoke $ref"
              # the compat check instead of a cycle, as the image user on a read-only root
              # filesystem: the chart's security context (issue 632)
              docker run --rm --read-only --tmpfs /tmp \
                --tmpfs /var/cache/javv:uid=65532,gid=65532 --tmpfs /var/lib/javv:uid=65532,gid=65532 \
                --entrypoint python "$ref" -m scanner.compat --scanner "$scanner"
              echo "::endgroup::"
            done
          done

      - name: Push the smoked matrix
        working-directory: scanner
        # cache hit — just pushes the smoked layers; the metadata file records each pushed digest
        run: docker buildx bake --allow=fs.read=.. -f docker-bake.hcl --push --metadata-file "$RUNNER_TEMP/bake-meta.json"
        env:
          REGISTRY: ${{ steps.vars.outputs.registry }}
          TRIVY_VERSIONS: ${{ steps.vars.outputs.trivy }}
          GRYPE_VERSIONS: ${{ steps.vars.outputs.grype }}
          GIT_SHA: ${{ steps.vars.outputs.sha }}

      # Supply-chain (M0b DoD, issue 74): an SBOM + a report-only self-scan of each pushed image, then a
      # keyless cosign signature + signed SBOM attestation. Everything works on the pushed DIGEST
      # (from the bake metadata), never a tag, so what is signed is exactly what was pushed.
      # by digest (versions.yaml `tag@sha256:`): this job can sign, so it runs no tag that can move
      - name: Install syft + grype (versions.yaml, from their official images, by digest)
        run: |
          syft=$(yq -r '.supply_chain.syft' versions.yaml)
          grype=$(yq -r '.supply_chain.grype' versions.yaml)
          for pair in "syft:anchore/syft:$syft" "grype:anchore/grype:$grype"; do
            bin=${pair%%:*}; img=${pair#*:}
            cid=$(docker create "$img")
            docker cp "$cid:/$bin" "$bin" && docker rm "$cid" >/dev/null
            sudo install -m 0755 "$bin" "/usr/local/bin/$bin" && rm "$bin"
          done

      - name: SBOM + self-scan (report-only) of each pushed digest
        id: sbom
        run: |
          mkdir -p sbom scan
          : > "$RUNNER_TEMP/to-sign.txt"
          # one row per bake target: its first (moving) tag and the digest it was pushed as
          jq -r 'to_entries[] | [(.value["image.name"] | split(",")[0]), .value["containerimage.digest"]] | @tsv' \
            "$RUNNER_TEMP/bake-meta.json" > "$RUNNER_TEMP/pushed.tsv"
          [ -s "$RUNNER_TEMP/pushed.tsv" ] || { echo "::error::bake metadata lists no pushed images"; exit 1; }
          while IFS=$'\t' read -r name digest; do
            repo=${name%:*}; ver=${name##*:}; scanner=${repo##*javv-scanner-}
            ref="$repo@$digest"; tag="$scanner-$ver"
            echo "::group::SBOM + scan $ref"
            syft "$ref" -o spdx-json="sbom/$tag.spdx.json"
            grype "sbom:sbom/$tag.spdx.json" -o table -o "json=scan/$tag.grype.json" || true  # report-only
            echo "::endgroup::"
            echo "$ref sbom/$tag.spdx.json" >> "$RUNNER_TEMP/to-sign.txt"
          done < "$RUNNER_TEMP/pushed.tsv"
          {
            echo "images<<EOF_IMAGES"
            cat "$RUNNER_TEMP/to-sign.txt"
            echo "EOF_IMAGES"
          } >> "$GITHUB_OUTPUT"
          echo "cosign=$(yq -r '.supply_chain.cosign' versions.yaml)" >> "$GITHUB_OUTPUT"

      - name: Sign + attest each pushed image (cosign keyless)
        uses: ./.github/actions/sign-image
        with:
          images: ${{ steps.sbom.outputs.images }}
          cosign-version: ${{ steps.sbom.outputs.cosign }}

      - name: Upload SBOM + scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scanner-image-provenance
          path: |
            sbom/
            scan/
