# OpenSSF Scorecard (issue 552): a weekly score of the repo's supply-chain practices (pinned actions,
# token permissions, branch protection, dangerous workflows, SAST, signed releases, ...), sent to
# the Security tab as code-scanning alerts and published to the public Scorecard API (the badge).
# It makes the state visible instead of remembered. Nothing here blocks a merge.
#
# The Branch-Protection check can only read part of the settings with the default token; the rest
# needs a fine-grained read token as `repo_token`, which is not configured.
name: Scorecard

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: sign the result for the public API
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
