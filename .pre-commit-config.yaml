# Local quality hooks (AUDIT.md N2) — surface lint/format/commit-message problems before they
# reach CI. setup-dev.sh installs this for you; never bypass with --no-verify (git-workflow.md).
#   uv tool install pre-commit && pre-commit install && pre-commit install --hook-type commit-msg
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3            # = versions.yaml toolchain.ruff (check-versions.sh)
    hooks:
      - id: ruff             # lint (with --fix)
        args: [--fix]
      - id: ruff-format      # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]   # k8s manifests are multi-doc
        # Helm templates are Go templates, not YAML until rendered; ct lint (helm lint) and
        # backend/tests/test_helm_*.py check them rendered (issue 725)
        exclude: '^deploy/helm/[^/]+/templates/'
      - id: check-json
        # tsconfig*.json are JSONC (comments allowed by TypeScript) — not strict JSON
        exclude: 'tsconfig.*\.json$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # The README walkthrough GIF is a deliberate ~3MB binary (issue 469): GitHub will not
        # play a repo-relative video, so an animated GIF is the only inline option. Named
        # explicitly rather than raising maxkb, so every OTHER large file still gets stopped.
        # Regenerate with development/scripts/make-demo-gif.sh; re-commit sparingly, since
        # each revision stays in .git forever. The triage videos of the docs site (issue 699) are
        # the same case: backend/tests/test_docs_site.py holds each one under its own size limit.
        exclude: '^(docs/assets/demo\.gif|docs/use/videos/[a-z0-9-]+\.mp4)$'

  - repo: local
    hooks:
      - id: guard-bash-cases
        name: bash guard cases
        # The guard's value is that it never blocks a legitimate command, which only a suite
        # proves. Run it whenever the guard changes, so it can't rot into false positives.
        entry: python3 .claude/hooks/test_guard_bash.py
        language: system
        pass_filenames: false
        files: '^\.claude/hooks/'

      - id: conventional-commit-cases
        name: commit-message hook cases
        # Same reason as the guard cases: the hook must reject what CI's commitlint rejects and
        # nothing it accepts, which only the case suite proves.
        entry: bash development/hooks/test-conventional-commit.sh
        language: system
        pass_filenames: false
        files: '^development/hooks/'

      - id: conventional-commit
        name: conventional commit message
        # Mirrors CI's commitlint (commitlint.config.mjs): the 6 types, subject case and period,
        # header and every body/footer line at most 100 chars.
        entry: development/hooks/conventional-commit.sh
        language: script
        stages: [commit-msg]
