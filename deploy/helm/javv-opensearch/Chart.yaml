apiVersion: v2
name: javv-opensearch
description: >-
  OpenSearch for JAVV: one node with its security plugin on and admin as its only password user.
  A wrapper around the official opensearch chart.
type: application
# the JAVV release this chart ships with (issue 725 ruling 4); release-please moves it
version: 0.8.4  # x-release-please-version
# the OpenSearch inside: versions.yaml datastore.opensearch, held by check-versions.sh
appVersion: "3.9.0"
home: https://github.com/Danube-Labs/javv-poc
sources:
  - https://github.com/Danube-Labs/javv-poc/tree/main/deploy/helm/javv-opensearch
  - https://github.com/opensearch-project/helm-charts
dependencies:
  - name: opensearch
    version: 3.9.0
    repository: https://opensearch-project.github.io/helm-charts
