{{- $javv := .Values.opensearch.javv -}}
{{- $own := include "javv-opensearch.ownCertificates" $javv -}}
{{- $os := .Values.opensearch -}}
# `helm test`: the store's login is on, admin and javv are its only password users, javv holds
# the javv role alone and is refused the security API (issue 729), and with your own certificates
# the https endpoint passes a check against your CA. ct install runs it in CI.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-javv-opensearch-login
  labels:
    {{- include "javv-opensearch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # kept after a run so `helm test --logs` (and ct install) can read it; the next run replaces it
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: login
      image: "{{ $os.image.repository }}:{{ $os.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ $os.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      env:
        - name: JAVV_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-opensearch.adminSecret" (dict "javv" $javv "Release" .Release) }}
              key: password
        - name: JAVV_BACKEND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-opensearch.backendSecret" (dict "javv" $javv "Release" .Release) }}
              key: password
        - name: BASE
          value: https://{{ include "javv-opensearch.service" . }}:{{ $os.httpPort }}
        - name: TLS
          # the demo certificate names neither the Service nor a CA anyone should trust
          value: {{ ternary "--cacert /javv-tls/ca.crt" "--insecure" (eq $own "true") | quote }}
      command:
        - /bin/bash
        - -c
        - |
          set -u
          fail() { echo "FAIL: $*" >&2; exit 1; }
          # a login goes to curl as config on stdin, never as an argument; " and \ escaped
          login() { printf 'user = "%s"\n' "$(printf %s "$1" | sed 's/[\\"]/\\&/g')"; }
          as() { local who=$1; shift; login "$who" | curl -s $TLS -K - "$@"; }

          # the security index can trail the port opening by a few seconds
          for _ in $(seq 1 60); do
            health=$(as "admin:$JAVV_ADMIN_PASSWORD" -f "$BASE/_cluster/health") && break
            sleep 2
          done
          [ -n "${health:-}" ] || fail "admin could not read the cluster health"
          echo "$health" | grep -Eq '"status":"(green|yellow)"' || fail "health: $health"

          code=$(curl -s $TLS -o /dev/null -w '%{http_code}' "$BASE/")
          [ "$code" = 401 ] || fail "a request without a login got $code, want 401"

          users=$(as "admin:$JAVV_ADMIN_PASSWORD" -f "$BASE/_plugins/_security/api/internalusers") \
            || fail "admin could not list the users"
          count=$(printf %s "$users" | grep -o '"reserved":' | wc -l)
          [ "$count" = 2 ] && printf %s "$users" | grep -q '"admin":' \
            && printf %s "$users" | grep -q '"javv":' \
            || fail "want admin and javv, found $count users"

          # javv, the user JAVV's backend signs in as, holds the javv role and nothing else
          info=$(as "javv:$JAVV_BACKEND_PASSWORD" -f "$BASE/_plugins/_security/authinfo") \
            || fail "javv could not sign in"
          printf %s "$info" | grep -q '"roles":\["javv"\]' || fail "javv's roles: $info"
          code=$(as "javv:$JAVV_BACKEND_PASSWORD" -o /dev/null -w '%{http_code}' \
            "$BASE/_plugins/_security/api/internalusers")
          [ "$code" = 403 ] || fail "javv got $code from the security API, want 403"

          # one of the demo users the image would otherwise add (issue 736)
          code=$(as readall:readall -o /dev/null -w '%{http_code}' "$BASE/_search")
          [ "$code" = 401 ] || fail "readall got $code, want 401"
          echo "ok: login on, admin and javv alone, javv on its role, readall refused"
      {{- if eq $own "true" }}
      volumeMounts:
        - name: javv-tls
          mountPath: /javv-tls
          readOnly: true
  volumes:
    - name: javv-tls
      secret:
        secretName: {{ include "javv-opensearch.tlsSecret" (dict "javv" $javv "Release" .Release) }}
        items:
          - key: ca.crt
            path: ca.crt
      {{- end }}
