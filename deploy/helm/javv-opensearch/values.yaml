# OpenSearch for JAVV. Everything is under `opensearch:`: the values of the official OpenSearch
# chart, set to what deploy/compose/compose.yaml runs. The keys of JAVV are under
# `opensearch.javv`. Only there can both the templates of the official chart (config,
# extraVolumes, extraVolumeMounts, extraInitContainers) and the templates of this chart read them.
# You can also set any other key of the official chart here:
# https://github.com/opensearch-project/helm-charts/blob/main/charts/opensearch/values.yaml

opensearch:
  javv:
    auth:
      # -- A Secret with the admin password under the key `password`. Set this value or `password`.
      existingSecret: ""
      # -- The admin password. The chart puts it in a Secret. The rules of OpenSearch: 8 characters
      # or more, with upper case, lower case, a digit and a special character, and not a common
      # password.
      password: ""
    backend:
      # -- A Secret with the password of `javv`, under the key `password`. `javv` is the user that
      # the JAVV backend signs in as. Set this value or `password`. The javv chart reads it
      # (`opensearch.passwordSecret`).
      existingSecret: ""
      # -- The password of `javv`. The chart puts it in the Secret
      # `<release>-javv-opensearch-backend`. Use a long random string (`openssl rand -hex 24`).
      password: ""
    tls:
      # -- A Secret with your certificate: `tls.crt`, `tls.key` (PKCS#8) and `ca.crt`. When it is
      # empty and `certManager.enabled` is false, OpenSearch uses its demo certificates. Their key
      # is public.
      existingSecret: ""
      certManager:
        # -- Get the certificate from cert-manager, in the Secret `<release>-javv-opensearch-tls`.
        enabled: false
        # -- The cert-manager Issuer or ClusterIssuer: `name`, and `kind` if it is not an Issuer.
        issuerRef: {}
      # -- With your own certificates: the subject DNs of the client certificates that can run
      # securityadmin.sh of OpenSearch. A change of the admin password needs this tool. The demo
      # setup has its own.
      adminDn: []

  # names: the Service JAVV signs in to is `javv-opensearch` (https, port 9200)
  clusterName: javv-opensearch
  masterService: javv-opensearch

  # -- One node: JAVV runs one OpenSearch. With a different value, the install fails.
  singleNode: true

  image:
    # -- `datastore.opensearch` in versions.yaml. `check-versions.sh` keeps it equal. The chart sets
    # it, because the version of the official chart and its OpenSearch version can be different.
    tag: "3.9.0"

  # -- The OpenSearch heap, as in compose.
  opensearchJavaOpts: "-Xms1g -Xmx1g"

  persistence:
    # -- Off. When it is on, the official chart adds an init container that changes the owner of the
    # volume. That container runs as root, on a busybox image with no pinned version. The `fsGroup`
    # of the pod (1000, from the official chart) already lets OpenSearch write to the volume.
    enableInitChown: false

  # The same settings as the compose file's OpenSearch.
  extraEnvs:
    # JAVV runs its own index lifecycle and does not use query insights; their internal indices
    # would otherwise hold a single node on yellow
    - name: plugins.index_state_management.enabled
      value: "false"
    - name: plugins.index_state_management.history.enabled
      value: "false"
    - name: search.insights.top_queries.latency.enabled
      value: "false"
    - name: search.insights.top_queries.cpu.enabled
      value: "false"
    - name: search.insights.top_queries.memory.enabled
      value: "false"
    # where Settings › Data & OpenSearch takes snapshots, inside the data volume
    - name: path.repo
      value: /usr/share/opensearch/data/snapshots
    # OpenSearch's own audit log is off: it writes a new index every day, and with ISM off
    # nothing deletes them. JAVV keeps its own audit trail.
    - name: plugins.security.audit.type
      value: noop

  # opensearch.yml. With your own certificates it carries the TLS settings, and the image's demo
  # setup then leaves the node alone ("already configured for Security"). Without them the demo
  # setup adds its demo certificates to this file at start. Nothing here may mention
  # plugins.security in demo mode, or the demo setup would skip its certificates.
  config:
    opensearch.yml: |
      cluster.name: {{ .Values.clusterName }}
      network.host: 0.0.0.0
      {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
      plugins.security.ssl.transport.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.transport.pemkey_filepath: certs/tls.key
      plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.crt
      transport.ssl.enforce_hostname_verification: false
      plugins.security.ssl.http.enabled: true
      plugins.security.ssl.http.pemcert_filepath: certs/tls.crt
      plugins.security.ssl.http.pemkey_filepath: certs/tls.key
      plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.crt
      # a renewed certificate is read without a restart; the Secret is mounted as a directory,
      # which Kubernetes updates in place (a subPath mount never sees an update)
      plugins.security.ssl.certificates_hot_reload.enabled: true
      plugins.security.allow_default_init_securityindex: true
      {{- with .Values.javv.tls.adminDn }}
      plugins.security.authcz.admin_dn:
        {{- toYaml . | nindent 2 }}
      {{- end }}
      plugins.security.enable_snapshot_restore_privilege: true
      plugins.security.check_snapshot_restore_write_privileges: true
      plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
      plugins.security.system_indices.enabled: true
      {{- end }}

  # Only admin and javv sign in with a password. The image's users file also holds six demo users
  # whose passwords are their own names, and no setting turns them off. This init
  # container writes a file with admin and javv, the user JAVV's backend signs in as,
  # each password hashed from its Secret by OpenSearch's own hash.sh (read from the environment,
  # never a process argument), and the node reads it in place of the image's. The javv role and
  # its mapping come from files/ (the compose file carries the same), mounted the same way.
  # OpenSearch loads these files on its first start; later the security index holds them.
  extraInitContainers: |
    - name: javv-users
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          hashed() {
            local hash
            hash=$(plugins/opensearch-security/tools/hash.sh -env "$1" | tail -n 1)
            case "$hash" in '$2'*) printf %s "$hash" ;; *) echo "hash.sh gave no bcrypt hash for $1" >&2; return 1 ;; esac
          }
          admin=$(hashed JAVV_ADMIN_PASSWORD)
          javv=$(hashed JAVV_BACKEND_PASSWORD)
          printf -- '---\n_meta:\n  type: "internalusers"\n  config_version: 2\nadmin:\n  hash: "%s"\n  reserved: true\n  backend_roles:\n  - "admin"\n  description: "JAVV admin user"\njavv:\n  hash: "%s"\n  reserved: false\n  description: "JAVV backend"\n' "$admin" "$javv" > /javv-users/internal_users.yml
      env:
        - name: JAVV_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-opensearch.adminSecret" (dict "javv" .Values.javv "Release" .Release) }}
              key: password
        - name: JAVV_BACKEND_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "javv-opensearch.backendSecret" (dict "javv" .Values.javv "Release" .Release) }}
              key: password
      securityContext:
        {{- toYaml .Values.securityContext | nindent 4 }}
      volumeMounts:
        - name: javv-users
          mountPath: /javv-users

  extraVolumes: |
    - name: javv-users
      emptyDir: {}
    - name: javv-security
      configMap:
        name: {{ .Release.Name }}-javv-opensearch-security
    {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
    - name: javv-tls
      secret:
        secretName: {{ include "javv-opensearch.tlsSecret" (dict "javv" .Values.javv "Release" .Release) }}
    {{- end }}

  extraVolumeMounts: |
    - name: javv-users
      mountPath: /usr/share/opensearch/config/opensearch-security/internal_users.yml
      subPath: internal_users.yml
    - name: javv-security
      mountPath: /usr/share/opensearch/config/opensearch-security/roles.yml
      subPath: roles.yml
    - name: javv-security
      mountPath: /usr/share/opensearch/config/opensearch-security/roles_mapping.yml
      subPath: roles_mapping.yml
    {{- if include "javv-opensearch.ownCertificates" .Values.javv }}
    - name: javv-tls
      mountPath: /usr/share/opensearch/config/certs
      readOnly: true
    {{- end }}
