{{- range $name := include "javv-scanner.scanners" . | fromJsonArray }}
{{- $s := index $.Values $name }}
{{- if $s.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "javv-scanner.fullname" $ }}-{{ $name }}
  labels:
    {{- include "javv-scanner.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  schedule: {{ $s.schedule | quote }}
  {{- with $s.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  # One cycle at a time per scanner (D40): each cycle gets its scan_order from JAVV, and an overlap
  # would push two cycles' results for one scanner at once. A cycle that runs into the next
  # schedule makes that one skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    # also on a Job made by hand from this CronJob, so "is a cycle running" can find both kinds
    metadata:
      labels:
        app.kubernetes.io/name: javv-scanner
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      activeDeadlineSeconds: {{ $s.activeDeadlineSeconds }}
      # a failed cycle is retried by the next schedule; a bad setting would only fail again
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: javv-scanner
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: {{ $name }}
            {{- with $s.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $s.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "javv-scanner.serviceAccount" $ }}
          # the scan lists pods and reads kube-system; the account allows that and nothing else
          automountServiceAccountToken: true
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- with $s.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          initContainers:
            {{- include "javv-scanner.refreshContainer" $ctx | nindent 12 }}
          containers:
            - name: {{ $name }}
              image: {{ include "javv-scanner.image" $ctx | quote }}
              imagePullPolicy: {{ $s.image.pullPolicy }}
              env:
                - name: JAVV_BACKEND_URL
                  value: {{ $.Values.backendUrl | quote }}
                - name: JAVV_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "javv-scanner.tokenSecret" $ctx }}
                      key: {{ $s.token.key }}
                {{- with $.Values.clusterId }}
                - name: JAVV_CLUSTER_ID
                  value: {{ . | quote }}
                {{- end }}
                {{- range $key, $value := $s.config }}
                {{- if ne (toString $value) "" }}
                - name: {{ $key }}
                  value: {{ $value | toString | quote }}
                {{- end }}
                {{- end }}
                {{- include "javv-scanner.noUpdate" $name | nindent 16 }}
                {{- if $s.registryAuth.existingSecret }}
                # both binaries read config.json in this directory; the image's HOME has none
                - name: DOCKER_CONFIG
                  value: /etc/javv/registry
                {{- end }}
                {{- with $s.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              {{- with $s.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: vulndb
                  mountPath: /var/cache/javv
                - name: dead-letter
                  mountPath: /var/lib/javv
                - name: tmp
                  mountPath: /tmp
                {{- if $s.registryAuth.existingSecret }}
                - name: registry-auth
                  mountPath: /etc/javv/registry
                  readOnly: true
                {{- end }}
          volumes:
            - name: vulndb
              persistentVolumeClaim:
                claimName: {{ include "javv-scanner.claim" $ctx }}
            - name: dead-letter
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            {{- with $s.registryAuth.existingSecret }}
            # Kubernetes mounts the login: the scanner's own account cannot read Secrets (issue 739)
            - name: registry-auth
              secret:
                secretName: {{ . }}
                items:
                  - key: .dockerconfigjson
                    path: config.json
            {{- end }}
          {{- with $s.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
