# What a scanner cycle asks the Kubernetes API (scanner/src/scanner/run.py, discovery.py): every
# running pod, to find the images, and the kube-system namespace, whose UID is the cluster's id in
# JAVV. Nothing else, and no Secrets (ruled on issue 725). A registry login is a volume that
# Kubernetes mounts into the scan container, so it needs no rule here (issue 739).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "javv-scanner.serviceAccount" . }}
  labels:
    {{- include "javv-scanner.labels" . | nindent 4 }}
# only the scanner pods mount its token; they set it themselves
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "javv-scanner.clusterName" . }}
  labels:
    {{- include "javv-scanner.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "javv-scanner.clusterName" . }}
  labels:
    {{- include "javv-scanner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "javv-scanner.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "javv-scanner.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
