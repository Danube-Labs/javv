# JAVV's scanners for one monitored cluster. Install it in every cluster JAVV should scan; JAVV
# itself (the javv chart) can run anywhere the scanners reach over HTTP. Each scanner is its own
# CronJob with its own token, settings and vuln-DB cache: Trivy and Grype are never merged. Guide:
# docs/DEPLOYING.md, "Connect the scanners".

# -- The address of JAVV, as the scanners reach it: the frontend Service of the javv chart, or
# what you put in front of it. Examples: `http://javv.javv.svc:8080` in the same cluster, and
# `https://javv.example.com` from a different cluster. You must set it.
backendUrl: ""

# -- The id of this cluster in JAVV. When it is empty, the scanners read the UID of the
# `kube-system` namespace. When you set it, the scanners verify it: a cycle that reaches a
# different cluster stops, and does not scan.
clusterId: ""

trivy:
  # -- Run the Trivy CronJob.
  enabled: true
  # -- When a cycle starts, in the time zone of the CronJob. A cycle each 6 hours keeps each
  # finding well inside the 3-day staleness window of JAVV. Grype runs half an hour later, so the
  # two downloads do not occur at the same time.
  schedule: "0 */6 * * *"
  # -- The time zone of `schedule`, for example `Europe/Bucharest`. When it is empty, the zone of
  # the cluster applies, which is UTC on most clusters.
  timeZone: ""
  # -- Kubernetes stops a cycle that runs for longer than this number of seconds. Only one cycle
  # runs at a time, so a cycle that does not end would stop each later cycle.
  activeDeadlineSeconds: 19800

  image:
    repository: ghcr.io/danube-labs/javv-scanner-trivy
    # -- The Trivy version, from versions.yaml (`scanners.trivy.current`). JAVV publishes the tag
    # again when it changes the image for that version. Thus each run pulls the image.
    tag: "0.75.0"  # versions.yaml scanners.trivy.current
    # -- `sha256:...`: run exactly that image. It replaces `tag`. It is empty in the repository.
    # The chart of a release sets it to the digest that the tag named at the release.
    digest: ""
    pullPolicy: Always

  # -- The ingest token that JAVV made for this cluster and Trivy (Settings › Access & tokens).
  # Give a Secret that holds it under `key`. Or give `value`, and the chart puts it in a Secret.
  token:
    existingSecret: ""
    key: token
    value: ""

  # -- A registry login for the images from private registries: the name of a
  # `kubernetes.io/dockerconfigjson` Secret in the namespace of the chart. The scan container mounts
  # it, and `DOCKER_CONFIG` tells Trivy where it is. When it is empty, Trivy pulls each image with
  # no login.
  registryAuth:
    existingSecret: ""

  vulnDb:
    # -- The source of the vulnerability database (`--db-repository`, OCI repositories in sequence).
    # When it is empty, Trivy uses `mirror.gcr.io/aquasec/trivy-db:2`, then
    # `ghcr.io/aquasecurity/trivy-db:2`.
    repository: ""
    # -- The source of the Java index database (`--java-db-repository`). When it is empty, Trivy
    # uses `mirror.gcr.io/aquasec/trivy-java-db:1`, then `ghcr.io/aquasecurity/trivy-java-db:1`.
    javaRepository: ""
    # -- The cache volume. In October 2026, the two Trivy databases used 2.9 GB. This size gives
    # them space to grow.
    size: 10Gi
    # -- When it is empty, the default StorageClass of the cluster applies.
    storageClass: ""
    # -- Your own PersistentVolumeClaim. The chart then makes no claim.
    existingClaim: ""

  # -- The scan settings of Trivy (docs/CONFIGURATION.md, "Trivy settings"), at their defaults.
  # An empty value means not set.
  # @default -- every setting at its code default. values.yaml has the list.
  config:
    # debug | info | warning | error
    JAVV_LOG_LEVEL: "info"
    # what Trivy looks for: vuln, misconfig, secret, license (comma-separated)
    JAVV_TRIVY_SCANNERS: "vuln"
    # leave out vulnerabilities with no fixed version
    JAVV_TRIVY_IGNORE_UNFIXED: "false"
    # only these severities (CRITICAL,HIGH); empty is all
    JAVV_TRIVY_SEVERITIES: ""
    # os, library; empty is Trivy's default
    JAVV_TRIVY_PKG_TYPES: ""
    # one image's scan limit (5m0s); empty is Trivy's default
    JAVV_TRIVY_TIMEOUT: ""
    # seconds a cycle may spend retrying its pushes and its inventory commit, in all
    JAVV_PUSH_RETRY_BUDGET_SECONDS: "360"

  # -- More environment variables for the refresh and the scan, in the form of Kubernetes.
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podLabels: {}
  podAnnotations: {}

grype:
  # -- Run the Grype CronJob.
  enabled: true
  # -- When a cycle starts, in the time zone of the CronJob.
  schedule: "30 */6 * * *"
  # -- The time zone of `schedule`. When it is empty, the zone of the cluster applies, which is
  # UTC on most clusters.
  timeZone: ""
  # -- Kubernetes stops a cycle that runs for longer than this number of seconds.
  activeDeadlineSeconds: 19800

  image:
    repository: ghcr.io/danube-labs/javv-scanner-grype
    # -- The Grype version, from versions.yaml (`scanners.grype.current`). JAVV publishes the tag
    # again when it changes the image for that version. Thus each run pulls the image.
    tag: "0.120.1"  # versions.yaml scanners.grype.current
    # -- `sha256:...`: run exactly that image. It replaces `tag`. It is empty in the repository.
    # The chart of a release sets it to the digest that the tag named at the release.
    digest: ""
    pullPolicy: Always

  # -- The ingest token that JAVV made for this cluster and Grype. Give a Secret that holds it
  # under `key`. Or give `value`, and the chart puts it in a Secret.
  token:
    existingSecret: ""
    key: token
    value: ""

  # -- A registry login for the images from private registries, as for Trivy. It can be the same
  # Secret.
  registryAuth:
    existingSecret: ""

  vulnDb:
    # -- The source of the vulnerability database (`GRYPE_DB_UPDATE_URL`, the list of database
    # builds). When it is empty, Grype uses `https://grype.anchore.io/databases`.
    updateUrl: ""
    # -- The cache volume. In October 2026, the Grype database used 3.0 GB. This size gives it
    # space to grow.
    size: 10Gi
    # -- When it is empty, the default StorageClass of the cluster applies.
    storageClass: ""
    # -- Your own PersistentVolumeClaim. The chart then makes no claim.
    existingClaim: ""

  # -- The scan settings of Grype (docs/CONFIGURATION.md, "Grype settings"), at their defaults.
  # An empty value means not set.
  # @default -- every setting at its code default. values.yaml has the list.
  config:
    # debug | info | warning | error
    JAVV_LOG_LEVEL: "info"
    # leave out vulnerabilities with no fixed version
    JAVV_GRYPE_ONLY_FIXED: "false"
    # squashed | all-layers | deep-squashed; empty is Grype's default
    JAVV_GRYPE_SCOPE: ""
    # seconds before one image's scan is stopped
    JAVV_GRYPE_SCAN_TIMEOUT: "600"
    # seconds a cycle may spend retrying its pushes and its inventory commit, in all
    JAVV_PUSH_RETRY_BUDGET_SECONDS: "360"

  # -- More environment variables for the refresh and the scan, in the form of Kubernetes.
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podLabels: {}
  podAnnotations: {}

# -- Both scanners run as the user of their images, with a read-only root. They write only to the
# database cache, the dead-letter file and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
