# JAVV's backend and frontend. Built from deploy/compose/compose.yaml: the same settings, the same
# defaults, the same comments. backend/tests/test_compose_settings.py holds the settings below to
# the code exactly as it holds the compose file. Guide: docs/DEPLOYING.md.
#
# The store is the javv-opensearch chart (same namespace by default); scanners in each monitored
# cluster are the javv-scanner chart.

backend:
  image:
    repository: ghcr.io/danube-labs/javv-backend
    # -- The release of this chart. release-please changes it.
    tag: "0.8.4"  # x-release-please-version
    pullPolicy: IfNotPresent

  # -- Each backend setting, at its default, by the name that the backend reads
  # (docs/CONFIGURATION.md, "Backend settings"). Set one with `--set
  # backend.config.TZ=Europe/Bucharest`, or in your values file. The secrets are not here: see
  # `secrets` and `opensearch`.
  # @default -- every setting at its code default. values.yaml has the list.
  config:
    # --- deployment ---
    # prod refuses to start on the dev secret key (the image itself defaults to dev)
    JAVV_ENV: "prod"
    # debug | info | warning | error; an unknown name stops the backend at start
    JAVV_LOG_LEVEL: "info"
    # the zone the job schedules below are read in; a container has none of its own
    TZ: "UTC"

    # the javv-opensearch Service in this namespace, over https
    JAVV_OPENSEARCH_URL: "https://javv-opensearch:9200"
    # seconds before a store request gives up
    JAVV_REQUEST_TIMEOUT: "30.0"
    # check the store and create or update the indices before serving
    JAVV_BOOTSTRAP_ON_STARTUP: "true"
    # the user JAVV signs in to OpenSearch as: javv, which holds only the javv role
    JAVV_OPENSEARCH_USERNAME: "javv"
    # a PEM file of CA certificates; leave it empty here: opensearch.caSecret sets it
    JAVV_OPENSEARCH_CA_BUNDLE: ""
    # false for OpenSearch's demo certificates, which name neither the Service nor a CA anyone
    # should trust; the backend logs one warning at start for it. opensearch.caSecret turns it on.
    JAVV_OPENSEARCH_VERIFY_CERTS: "false"

    # the first admin's user name (the password is in the Secret, see `secrets`)
    JAVV_BOOTSTRAP_ADMIN_USERNAME: "admin"

    # --- sign-in ---
    # the session cookie's Secure flag: keep true behind anything that terminates TLS;
    # set false only when the app is reached over plain http (or login fails)
    JAVV_SESSION_COOKIE_SECURE: "true"
    # hours a sign-in lasts
    JAVV_SESSION_TTL_HOURS: "24.0"
    # hours an expired session row is kept before the session sweep deletes it
    JAVV_SESSION_SWEEP_GRACE_HOURS: "24.0"
    # failed logins per user name within the window before it is locked
    JAVV_LOGIN_MAX_ATTEMPTS: "5"
    # the lockout window, in minutes
    JAVV_LOGIN_LOCKOUT_MINUTES: "15.0"

    # --- scanner pushes ---
    # largest push on the wire, in bytes (10 MiB)
    JAVV_INGEST_MAX_COMPRESSED_BYTES: "10485760"
    # largest push once decompressed, in bytes (60 MiB)
    JAVV_INGEST_MAX_BODY_BYTES: "62914560"
    # pushes per token per minute
    JAVV_INGEST_RATE_LIMIT_PER_MINUTE: "120"
    # minutes a scan time may be ahead of the backend's clock
    JAVV_INGEST_FUTURE_TOLERANCE_MINUTES: "15"

    # --- triage, search and exports ---
    # a bulk action on at most this many findings applies at once; more is refused
    JAVV_BULK_INLINE_LIMIT: "5000"
    # a bulk selector may match at most this many findings
    JAVV_BULK_MAX_TARGETS: "10000"
    # how long a page of a search cursor stays open between pages
    JAVV_SEARCH_PIT_KEEP_ALIVE: "2m"
    # most rows an immediate export may hold; larger ones use a scheduled export
    JAVV_EXPORT_MAX_ROWS: "50000"
    # open search cursors and exports per user at one time
    JAVV_MAX_CONCURRENT_PITS_PER_PRINCIPAL: "10"
    # browser warning batches per user per minute
    JAVV_CLIENT_EVENTS_RATE_LIMIT_PER_MINUTE: "60"

    # --- scheduled exports ---
    # hours a finished export is kept (Settings › Data & OpenSearch can change it)
    JAVV_EXPORT_TTL_HOURS: "24"
    # largest single export, in bytes (500 MiB); a larger one fails
    JAVV_EXPORT_MAX_BYTES: "524288000"
    # pause between export pages, in milliseconds, so exports leave room for pushes
    JAVV_REPORT_DRAIN_SLEEP_MS: "200"
    # seconds without a heartbeat before a running export or job counts as abandoned
    JAVV_REPORT_LEASE_TTL_SECONDS: "300"

    # --- Data inspector ---
    # most hits one inspector search may return
    JAVV_INSPECT_MAX_HITS: "500"
    # largest inspector answer, in bytes (2 MiB)
    JAVV_INSPECT_MAX_RESPONSE_BYTES: "2097152"
    # seconds before an inspector query gives up
    JAVV_INSPECT_TIMEOUT_SECONDS: "10.0"
    # cluster retirement: the fleet defaults until a value is saved at runtime
    # days without an accepted scan before a cluster is retired (0 = never)
    JAVV_CLUSTER_RETIRE_AFTER_DAYS: "45"
    # days before retirement that the warning banner and the bell start
    JAVV_CLUSTER_RETIREMENT_WARN_DAYS: "7"

    # --- background jobs: cron expressions read in TZ; empty = never on a schedule ---
    # false stops every schedule; the jobs can still be run from the Data inspector
    JAVV_SCHEDULER_ENABLED: "true"
    # builds queued exports and bulk actions
    JAVV_JOB_REPORT_DRAIN_CRON: "*/5 * * * *"
    # deletes expired exports and their leftovers
    JAVV_JOB_REPORT_SWEEP_CRON: "15 * * * *"
    # marks findings stale and ends expired risk acceptances
    JAVV_JOB_STALENESS_SWEEP_CRON: "0 2 * * *"
    # rolls history indices over and drops those past retention
    JAVV_JOB_LIFECYCLE_SWEEP_CRON: "0 3 * * *"
    # removes findings gone from every scan for longer than the cleanup window
    JAVV_JOB_FINDINGS_CLEANUP_CRON: "0 4 * * *"
    # retires clusters silent past their window, brings back the ones that scan again
    JAVV_JOB_CLUSTER_RETIREMENT_CRON: "15 4 * * *"
    # deletes expired sign-in sessions
    JAVV_JOB_SESSION_SWEEP_CRON: "30 4 * * *"


  # -- More environment variables, in the form of Kubernetes (`name`, `value` or `valueFrom`).
  extraEnv: []

  # -- Stops the liveness probe while the backend starts. The backend verifies that OpenSearch
  # replies, and creates or updates the indices before it opens its port. 30 tries, 10 s apart: ten
  # JAVV_REQUEST_TIMEOUT periods.
  startupProbe:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 10
    failureThreshold: 30
  # -- While OpenSearch is unreachable, /readyz replies 503, and the Service sends no requests to
  # the backend.
  readinessProbe:
    httpGet: {path: /readyz, port: http}
    periodSeconds: 10
    failureThreshold: 3
  # -- Restarts a backend that does not reply. /healthz does not need OpenSearch. Thus when
  # OpenSearch stops, the app works with less, and Kubernetes does not restart it.
  livenessProbe:
    httpGet: {path: /healthz, port: http}
    periodSeconds: 20
    failureThreshold: 3

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podLabels: {}
  podAnnotations: {}

frontend:
  image:
    repository: ghcr.io/danube-labs/javv-frontend
    # -- The release of this chart. release-please changes it.
    tag: "0.8.4"  # x-release-please-version
    pullPolicy: IfNotPresent

  # -- The frontend holds no state. Thus you can run more than one.
  replicas: 1

  # -- The settings of the frontend server (docs/CONFIGURATION.md, "Frontend server settings").
  config:
    # where /api, /auth and /readyz are forwarded; empty = this chart's backend Service
    JAVV_BACKEND_URL: ""
    # seconds a connection to the backend may take to open before the answer is a 502; a slow
    # answer (an export) is never cut
    JAVV_BACKEND_CONNECT_TIMEOUT: "5"
    # debug | info | warning | error
    JAVV_LOG_LEVEL: "info"

  # -- Browsers and scanners both use this Service. The scanners push to /api/v1/ingest/scan
  # through it. You need nothing in front of it. Your own Ingress or gateway can point at it.
  service:
    type: ClusterIP
    port: 8080

  # -- The frontend serves the app without the backend. Thus it stays ready while the backend is
  # down. It then replies 502 for /api, /auth and /readyz, and the app shows "backend down".
  readinessProbe:
    httpGet: {path: /, port: http}
    periodSeconds: 10
  livenessProbe:
    httpGet: {path: /, port: http}
    periodSeconds: 20

  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  podLabels: {}
  podAnnotations: {}

secrets:
  # -- A Secret with the keys `secret-key` and `bootstrap-admin-password`. Set this value, or the
  # two values below. The chart never makes a secret key: a new key stops each ingest token and
  # each session.
  existingSecret: ""
  # -- The secret key of the backend (`JAVV_SECRET_KEY`). It hashes the ingest tokens and the
  # session ids, and it signs the download links. Use a long random string (`openssl rand -hex 32`),
  # and keep it. If you change it, each scanner gets 401, and each user must sign in again. Each
  # scanner then needs a new token. The chart puts the key in a Secret.
  secretKey: ""
  # -- The password of the first JAVV admin, 12 to 256 characters. A longer password stops the
  # backend at start. The backend uses it one time, when that admin does not exist.
  bootstrapAdminPassword: ""

opensearch:
  # -- The Secret with the password of javv, the OpenSearch user that JAVV signs in as. Use the
  # Secret of the javv-opensearch chart: `opensearch.javv.backend.existingSecret` there, or
  # `<its release>-javv-opensearch-backend`. Never use the admin Secret: the backend needs only
  # javv.
  passwordSecret:
    name: ""
    key: password
  # -- A Secret with the CA of the OpenSearch certificate. For javv-opensearch with cert-manager,
  # it is `<its release>-javv-opensearch-tls`. When you set it, the chart mounts it, sets
  # JAVV_OPENSEARCH_CA_BUNDLE to it and sets JAVV_OPENSEARCH_VERIFY_CERTS to true. When it is
  # empty, the backend does not verify the demo certificates.
  caSecret:
    name: ""
    key: ca.crt

# -- Both containers run as the user of their images, with a read-only root and an emptyDir on
# /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
