# The operator docs site (issue 639), built by Zensical from the repository root:
#   uv run --project docs-site --frozen zensical build -f docs-site/mkdocs.yml --strict
#
# src/ holds a symlink to each published file, laid out as in the repository, so each file
# renders where it lives and the links between them work the same on GitHub and here. src/ is the
# list of what is published: nothing else in the repository reaches the site. (Zensical follows
# file symlinks, not folder ones.) The one real file there is the site's stylesheet.
# backend/tests/test_docs_site.py holds src/, the nav and the links in step.
site_name: JAVV
site_description: Docs for JAVV, Just Another Vulnerability Viewer
site_url: https://danube-labs.github.io/javv/
repo_url: https://github.com/Danube-Labs/javv
edit_uri: edit/main/
docs_dir: src
site_dir: site

theme:
  name: material
  # light or dark from the reader's system setting, with a toggle in the header
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - redirects:
      redirect_maps:
        index.md: docs/index.md

# Listing extensions replaces the defaults, so fenced code blocks need superfences here: without
# it every ``` block renders as one line of inline code, and the strict build still passes.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      # a ```mermaid block renders as a diagram only through this fence; without it, as code
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.snippets:
      # resolved from the folder the build runs in: the repository root, for README.md's table
      base_path: ["."]
      check_paths: true

extra_css:
  - stylesheets/javv.css

extra:
  version:
    provider: mike

nav:
  - Home: docs/index.md
  - Use JAVV:
      - Overview: docs/use/index.md
      - From a scan to a finding: docs/use/from-a-scan-to-a-finding.md
      - Set the state of a finding: docs/use/set-the-state-of-a-finding.md
      - Accept a risk: docs/use/accept-a-risk.md
      - Change many findings at once: docs/use/change-many-findings.md
      - When a scanner stops: docs/use/when-a-scanner-stops.md
      - See who changed what: docs/use/who-changed-what.md
      - Build a dashboard: docs/use/build-a-dashboard.md
  - Install:
      - Deploying: docs/DEPLOYING.md
      - Supported versions: docs/supported-versions.md
      - "Chart: javv": deploy/helm/javv/README.md
      - "Chart: javv-opensearch": deploy/helm/javv-opensearch/README.md
      - "Chart: javv-scanner": deploy/helm/javv-scanner/README.md
  - Configure: docs/CONFIGURATION.md
  - Operate:
      - Sizing OpenSearch: docs/runbooks/opensearch-sizing.md
      - Scaling and failures: docs/runbooks/multi-pod.md
      - Indices and data: docs/runbooks/indices-and-data.md
  - Upgrade:
      - Upgrading: docs/UPGRADING.md
      - Release notes: CHANGELOG.md
  - Integrate:
      - API: docs/API.md
      - Push from your own script: docs/INGEST-CONTRACT.md
  - Security: SECURITY.md
