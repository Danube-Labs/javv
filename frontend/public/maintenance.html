<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- no script: the page asks again every minute, so it leaves on its own once the app is back -->
    <meta http-equiv="refresh" content="60" />
    <title>JAVV: down for maintenance</title>
    <!--
      The maintenance page (SCREENS §18). One self-contained file: no script, no stylesheet, no
      font and no request to the backend, so it can be served while the backend is switched off.
      The app's fonts ship as hashed files this page cannot name, so it falls back to system
      fonts. The colors mirror src/styles/tokens.css (maintenance-page.spec.ts checks they still
      exist there), and the mark is a copy of src/assets/brand/icon.svg, drawn inline.
    -->
    <style>
      :root {
        --bg: #efeadf;
        --card: #ffffff;
        --line: #e7e0d3;
        --ink: #1b2935;
        --soft: #5d6a74;
        --coral-text: #a8481f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }
      .mono {
        font-family: 'Spline Sans Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--soft);
      }
      main {
        width: 340px;
        max-width: 100%;
        padding: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 18px;
      }
      .brand b {
        display: block;
        font-size: 22px;
        letter-spacing: -0.03em;
        color: var(--ink);
        line-height: 1.1;
      }
      .brand span {
        font-size: 11px;
        letter-spacing: 0.04em;
        color: var(--soft);
      }
      h1 {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg class="mark" aria-hidden="true" width="44" height="44" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7B57E"></stop>
      <stop offset="1" stop-color="#EC7E54"></stop>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE7C1"></stop>
      <stop offset="1" stop-color="#F4A368"></stop>
    </linearGradient>
    <clipPath id="lens"><circle cx="27" cy="26" r="13"></circle></clipPath>
  </defs>


  <rect x="0" y="0" width="64" height="64" rx="16" fill="#16232F"></rect>


  <line x1="30" y1="29" x2="51" y2="50" stroke="#F4A368" stroke-width="6.6" stroke-linecap="round"></line>


  <g clip-path="url(#lens)">
    <rect x="13" y="12" width="28" height="14.4" fill="url(#sky)"></rect>
    <rect x="13" y="26.4" width="28" height="13.6" fill="#21384A"></rect>

    <circle cx="27" cy="21" r="4.4" fill="#FCE7C1"></circle>

    <path d="M13 26.4 Q20 23.8 27 25.6 Q34 27.2 41 24.8 L41 27.2 L13 27.2 Z" fill="#C76A55" opacity="0.55"></path>

    <path d="M26.5 27.2 C26 30 23.5 31.4 24 34 C24.4 37 24.2 38.8 25.2 40.6 L30.8 40.6 C31.6 38.6 28 37 27.5 34 C27 31 29 30 28.5 27.2 Z" fill="url(#river)"></path>
  </g>


  <circle cx="27" cy="26" r="13" fill="none" stroke="#F4A368" stroke-width="3.3"></circle>
</svg>
        <div><b>javv</b><span class="mono">by Danube Labs</span></div>
      </div>
      <h1>Down for maintenance</h1>
      <p>The app is being updated and will be back shortly. Nothing is lost. This page checks again every minute.</p>
    </main>
  </body>
</html>
